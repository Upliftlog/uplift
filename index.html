<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0e0f12">
<title>UP/LIFT</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f12; --panel:#17191e; --panel2:#1f2229; --line:#2a2e37;
  --text:#eef0f4; --muted:#8b92a1; --accent:#ff7a1a; --accentInk:#141414;
  --good:#3ddc84; --bad:#ff5d5d; --blue:#6ab0ff;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{padding-bottom:84px;min-height:100vh}
body.resting{padding-bottom:160px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:#5b6170}
.mono{font-family:"JetBrains Mono",monospace}
header{position:sticky;top:0;z-index:5;background:rgba(14,15,18,.92);backdrop-filter:blur(10px);padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;letter-spacing:.5px;font-size:18px}
.brand span{color:var(--text)}
.brand{display:flex;align-items:center;gap:7px}
.brand .mark{width:26px;height:26px;flex:none}
.brand .bt{font-weight:800}
.brand .bt i{font-style:normal;color:#ff7a1a}
.count{font-size:12px;color:var(--muted);text-align:right;line-height:1.25}
.count.on{cursor:pointer;padding:2px 0 2px 10px}
.count b.add{font-size:13px;color:var(--text)}
.count b{color:var(--text);font-size:15px}
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.banner{background:#24180f;border:1px solid #5a3416;color:#efe7df;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.hidden{display:none!important}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:18px 2px 10px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.tplgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;min-height:86px}
.tpl:active{transform:scale(.98)}
.tpl b{display:block;font-size:16px;margin-bottom:4px}
.tpl small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.tpl.hy{border-color:#5a3416;background:linear-gradient(160deg,#221f12,#17191e)}
.tpl.hy b{color:var(--text)}
a.btn{color:var(--text);text-decoration:none}
.dtable td.exn{text-align:left!important;font-family:Inter,sans-serif!important;color:var(--text)!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.sessionhead{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.sessionhead input{font-weight:700;font-size:17px;background:transparent;border-color:transparent;padding:6px 4px}
.sessionhead input:focus{background:var(--panel2)}
.elapsed{color:var(--muted);font-size:13px;white-space:nowrap}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.exhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.exname{font-weight:700;font-size:16px;flex:1;line-height:1.25}
.tgt{display:inline-block;font-size:12px;font-weight:600;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin:0 0 8px}
.adv{font-size:13px;line-height:1.4;padding:8px 10px;border-radius:10px;margin-bottom:8px;background:var(--panel2);color:#d6dae2}
.adv.up{background:#14271d;color:#8ff0b6}
.adv.down{background:#2b1717;color:#ffaaaa}
.adv.hold{background:#24180f;color:#efe7df}
.adv.new{background:#16223a;color:#a9cdff}
.setrow.top input{border-color:var(--good)}
.setrow.low input{border-color:#b5652a;background:#24180f}
.dl{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:4px;font-family:Inter,sans-serif}
.dl.up{background:#14271d;color:var(--good)} .dl.dn{background:#2b1717;color:var(--bad)} .dl.eq{background:var(--panel2);color:var(--muted)} .dl.new{background:#16223a;color:var(--blue)}
.adv.base{background:#16223a;color:#a9cdff}
.tgt.sm{display:block;font-size:11px;padding:3px 8px;margin:5px 0 0;color:#c9cdd6}
select{appearance:auto}
.energy .stat{grid-template-columns:repeat(3,1fr)}
.step{display:flex;gap:10px;align-items:flex-start}
.step>span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accentInk);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:6px}
details.dd{margin-top:14px}
details.dd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-weight:700}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>summary span{flex:1}
details.dd>summary small{color:var(--muted);font-weight:500;font-size:12px;max-width:55%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.dd>summary::after{content:"▾";color:var(--muted);transition:transform .15s}
details.dd[open]>summary::after{transform:rotate(180deg)}
details.dd[open]>summary{border-color:#5a3416;margin-bottom:10px}
.ddh{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:14px 2px 8px}
.bday{padding:12px}
.bday .bdn{font-weight:700}
.bday .bdd{margin-top:6px;font-size:13px;padding:8px 10px}
.bx{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.bxg{display:grid;grid-template-columns:1.3fr .7fr 1fr 1fr;gap:6px;margin-top:6px}
.bxg label span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.bxg input,.bxg select{padding:8px 6px;font-size:14px}
.chg{font-size:14px;padding:5px 10px;border-radius:8px;background:var(--panel2);margin-bottom:5px}
.chg.add{background:#14271d;color:#8ff0b6}
.chg.rem{background:#2b1717;color:#ffaaaa}
.libr{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.libr:last-child{border-bottom:0}
.libr small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
body.locked{overflow:hidden}
.modal{overscroll-behavior:contain}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.picker{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.pk{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:640px;height:86vh;height:86dvh;display:flex;flex-direction:column;overflow:hidden}
.pkcats{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;flex:none;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pkcats::-webkit-scrollbar{display:none}
.pkcats .chip{flex:none}
.plist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 28px;touch-action:pan-y}
.pkh{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:14px 2px 6px}
.pki{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:13px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px;font-size:15px}
.pki small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.pki:active{background:var(--panel2)}
.pknew{background:#1f1813;border:1px solid #4d2e14;border-radius:12px;padding:12px;margin:10px 0}
.bname{flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:600}
.bname span{color:var(--muted);font-size:12px}
.bname.empty{color:var(--muted);font-weight:500}
.bsheet{padding:0;display:flex;flex-direction:column;overflow:hidden;max-height:90vh;max-height:90dvh}
.bscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px 10px}
.bpname{font-size:17px;font-weight:700;margin:10px 0 14px}
.bday2{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-bottom:12px}
.bdh{display:flex;align-items:center;gap:6px}
.bdn2{background:transparent;border:1px solid transparent;padding:5px 4px;font-weight:800;font-size:16px;flex:1;min-width:0}
.bdn2:focus{background:var(--panel2);border-color:var(--accent)}
.bdc{font-size:12px;color:var(--muted);white-space:nowrap}
.bdd2{background:transparent;border:1px solid transparent;padding:2px 4px 8px;font-size:13px;color:var(--muted)}
.bdd2:focus{background:var(--panel2);color:var(--text)}
.bdmenu{display:flex;gap:8px;margin:4px 0 8px}
.bexs{border-top:1px solid var(--line)}
.bxr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.bxe .bxr{border-bottom:0}
.bxn{width:22px;height:22px;border-radius:50%;background:var(--panel2);font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.bxname{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bxsum{font-size:12px;color:var(--muted);font-family:"JetBrains Mono",monospace;white-space:nowrap}
.chev{color:var(--muted);font-size:18px;transition:transform .15s;width:12px;text-align:center}
.bxr.open .chev{transform:rotate(90deg);color:var(--accent)}
.bxr.open .bxn{background:var(--accent);color:var(--accentInk)}
.bxe{background:var(--panel2);border-radius:12px;margin:6px -6px;padding:0 6px}
.bxf{padding:2px 2px 12px;display:grid;gap:12px}
.bxf .l{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.bxf input,.bxf select{background:var(--bg)}
.bname{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600}
.bname span{color:var(--text);font-size:12px;font-weight:600}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accentInk)}
.fl2{display:grid;grid-template-columns:1.1fr 1.2fr 1fr;gap:8px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:10px;height:42px}
.stepper button{width:34px;height:100%;font-size:18px}
.stepper b{font-family:"JetBrains Mono",monospace;font-size:15px}
.rr{display:flex;align-items:center;gap:4px;color:var(--muted)}
.rr input{text-align:center;padding:0 2px;height:42px;font-family:"JetBrains Mono",monospace}
.fl2 select,.fl2>div>input{height:42px;padding:0 8px}
.lnk{font-size:13px;color:var(--muted);padding:4px 2px;font-weight:600}
.lnk.danger{color:var(--bad)}
.badd{width:100%;padding:11px;margin-top:10px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-weight:600;font-size:14px}
.baddday{width:100%;padding:13px;border:1px dashed #5a3416;border-radius:12px;color:var(--text);font-weight:700;margin-top:2px}
.bfoot{flex:none;padding:12px 16px 18px;border-top:1px solid var(--line);background:var(--bg)}
.welcome{background:linear-gradient(160deg,#1f1712,var(--panel) 60%);border:1px solid var(--line);border-radius:16px;padding:16px;margin:6px 0 4px}
.wh{font-size:21px;font-weight:800;letter-spacing:.2px}
.ws{color:#c9cdd6;font-size:14px;margin-top:3px;line-height:1.4}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.wstats div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px}
.wstats b{display:block;font-family:"JetBrains Mono",monospace;font-size:21px;color:var(--text);margin-top:2px}
.wstats .wk{font-size:13px;opacity:.9}
.wstats b .u{font-size:13px;font-family:Inter,sans-serif;font-weight:600;color:#c9cdd6;margin-left:4px}
.wstats em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3}
.wstats div{border-top:3px solid var(--accent)}
.wstats small{display:block;font-size:11px;color:#c9cdd6;margin-top:2px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.wlast{font-size:13px;color:var(--muted);line-height:1.5}
.wlast b{color:var(--text)} .wlast b.acc{color:var(--text)}
.wbk{display:block;width:100%;text-align:left;margin-top:12px;padding:10px 12px;border-radius:10px;background:#24180f;border:1px solid #5a3416;color:#efe7df;font-size:13px;font-weight:600}
.schips{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 0 10px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:10px 0}
.sc{min-width:0;padding:2px 4px;border-left:1px solid var(--line);text-align:center}
.sc:first-child{border-left:0}
.sl{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.sv{display:block;font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.sv.na{color:#4a4f5b;font-weight:400}
.su{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px}
.hist .meta{margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view-log .hist{position:relative;overflow:hidden;background:#1a1d24;border:1px solid #2d323c;border-radius:16px;padding:14px 16px 14px 20px;margin-bottom:14px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 18px rgba(0,0,0,.25)}
#view-log .hist::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
#view-log .hist.cardio::before{background:#6ab0ff}
#view-log .hist.mix::before{background:linear-gradient(var(--accent) 50%,#6ab0ff 50%)}
#view-log .hist .top b{font-size:16px}
#view-log .hist .schips{background:var(--bg);border-color:#262a33}
#view-log .hist .meta{font-size:12.5px}
#view-log .hist:active{background:#1f232b}
.cal .calh b{font-size:16px}
.calsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 12px;text-align:center}
.calsum b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.calsum small{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.dotk{display:inline-block;width:8px;height:8px;border-radius:2px}
.dotk.s{background:var(--accent)} .dotk.c{background:#6ab0ff}
.calw,.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calw span{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cd{aspect-ratio:1;min-width:0;width:100%;padding:0;border-radius:9px;background:var(--panel2);border:1px solid transparent;font-size:13px;font-weight:600;color:#c9cdd6;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.cd.cpad{background:transparent;visibility:hidden}
.cd.future{opacity:.35}
.cd.today{border-color:#eef0f4}
.cd.strength{background:var(--accent);color:#141414}
.cd.cardio{background:#6ab0ff;color:#0d1a2b}
.cd.mix{background:linear-gradient(135deg,var(--accent) 50%,#6ab0ff 50%);color:#141414}
.cd:disabled{cursor:default}
.bwv{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bwv span{font-size:15px;font-weight:600;color:var(--muted)}
.bwrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.bwrow small{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
.bwrow b{display:block;font-size:15px;margin-top:3px}
.bwrow em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:1px}
.wlrow{display:grid;grid-template-columns:1fr 74px auto 12px;gap:8px;align-items:center;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
.wlrow:last-child{border-bottom:0}
.wlrow .nm{font-weight:600;font-size:14px;min-width:0}
.wlrow .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.wlrow .v{font-family:"JetBrains Mono",monospace;font-size:13.5px;font-weight:700;white-space:nowrap;text-align:right}
.wlrow .chev{color:var(--muted)}
.tr{font-style:normal;font-size:10px;margin-left:5px;font-family:Inter,sans-serif}
.tr.up{color:var(--good)} .tr.down{color:var(--bad)} .tr.eq{color:var(--muted)}
.exstats button{text-align:left;background:var(--panel);border:1px solid rgba(61,220,132,.45);border-radius:12px;padding:10px;color:inherit;font:inherit}
.exstats b i{font-style:normal;font-size:.7em;color:var(--muted);margin-left:1px;font-weight:500}
.setlink{color:var(--good);font-size:14px}
.exh .d small{display:block;font-size:11.5px;margin-top:2px}
button.prrow{width:100%;text-align:left;color:inherit;font:inherit;background:none}
.prrow.cx{grid-template-columns:1fr 84px auto}
.prrow.cx .v{white-space:nowrap;text-align:right}
.prrow .chev{color:var(--muted);margin-left:6px;font-family:Inter,sans-serif}
.exstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.exstats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.exstats small{display:block;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:600}
.exstats b{display:block;font-size:15px;margin-top:4px;white-space:nowrap}
.exstats em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.exh{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.exh:last-child{border-bottom:0}
.exh .d{color:var(--muted);white-space:nowrap}
.exh .s{font-family:"JetBrains Mono",monospace;text-align:right}
.blrow{display:grid;grid-template-columns:1fr 72px 64px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.blrow.bl3{grid-template-columns:1fr 58px 52px 64px}
.blrow:last-child{border-bottom:0}
.blrow input{text-align:center;padding:10px 4px;font-family:"JetBrains Mono",monospace}
.bln{font-weight:600;font-size:14px;line-height:1.3}
.bln small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.exlast{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.4}

<body>
<header>
  <div class="brand"><svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><polyline points="132,262 256,138 380,262" fill="none" stroke="#ff7a1a" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/><g fill="#eef0f4"><rect x="104" y="348" width="304" height="22" rx="11"/><rect x="138" y="296" width="40" height="126" rx="12"/><rect x="108" y="320" width="26" height="78" rx="9"/><rect x="334" y="296" width="40" height="126" rx="12"/><rect x="378" y="320" width="26" height="78" rx="9"/></g></svg><b class="bt">UP<i>/</i>LIFT</b></div>
  <div class="count" id="countdown"></div>
</header>

<main>
  <div id="banner" class="banner hidden"></div>
  <section id="view-log"></section>
  <section id="view-progress" class="hidden"></section>
  <section id="view-baseline" class="hidden"></section>
</main>

<div id="rest" class="rest hidden">
  <div class="t" id="restT">2:00</div>
  <div class="sp muted" style="font-size:12px" id="restLbl">Rest</div>
  <button class="btn small" id="restMinus">−15</button>
  <button class="btn small" id="restPlus">+30</button>
  <button class="btn small" id="restStop">✕</button>
  <div class="restbar" id="restBar"></div>
</div>

<nav>
  <button data-v="log" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Log</button>
  <button data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Progress</button>
  <button data-v="baseline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Profile</button>
</nav>

<div id="modalRoot"></div>

<script>
/* ================== CONFIG ================== */
// Each person's own profile lives on their phone (Profile page), nothing personal is built in.
function getProfile(){ return LS.get("liftlog.profile",{})||{}; }
function raceDate(){ const p=getProfile(); if(!p.raceDate) return null; const d=new Date(p.raceDate+"T09:00:00"); return isNaN(d)?null:d; }
function athleteText(){ const p=getProfile(); const lines=[]; const en=energy();
  const me=[p.name, p.age&&`${p.age} y`, p.sex&&(p.sex==="m"?"male":"female"), p.height&&`${p.height} cm`, bodyKg()&&`${bodyKg()} kg`, p.bf&&`~${p.bf}% body fat${p.bfHow?` (${p.bfHow})`:""}`].filter(Boolean).join(", ");
  if(me) lines.push(`- ${me}.`);
  if(en.tdee) lines.push(`- Estimated maintenance (TDEE): ~${en.tdee} kcal/day (BMR ${en.bmr}, activity "${(ACTIVITY.find(a=>a.v===String(p.activity))||{}).t}").`);
  if(p.race||p.raceDate) lines.push(`- Event/goal: ${p.race||"(unnamed)"}${p.raceDate?` by ${p.raceDate}`:""}.`);
  if(p.goalKg||p.goalBf) lines.push(`- Body goal: ${[p.goalKg&&`about ${p.goalKg} kg`, p.goalBf&&`${p.goalBf}% body fat`].filter(Boolean).join(", ")}.`);
  if(p.about) lines.push(p.about.trim());
  return lines.length ? `Athlete profile (their own words):\n${lines.join("\n")}` : "Athlete profile: not filled in yet.";
}
/* ---------- energy ----------
   BMR: Mifflin-St Jeor. TDEE = BMR × activity factor (the factor already includes your training).
   Workout burn (estimate): runs via ACSM running/walking equations from your distance & time,
   HYROX stations at MET 8 for their logged time, the rest of the session at MET 4 (lifting incl. rests)
   or MET 3 (transitions/walking on run & HYROX days). kcal/min = MET × 3.5 × kg / 200. */
const ACTIVITY=[
  {v:"1.2",  t:"Sedentary",  d:"Desk job, little walking, no training"},
  {v:"1.375",t:"Light",      d:"Mostly sitting, training 1–3×/week"},
  {v:"1.55", t:"Moderate",   d:"On your feet some of the day, or training 3–5×/week"},
  {v:"1.725",t:"Very active",d:"Physical job + training, or hard training 6–7×/week"},
  {v:"1.9",  t:"Extreme",    d:"Heavy manual job + daily hard training"}];
function bodyKg(){ return (weights[0]&&weights[0].kg) || num(getProfile().weight) || null; }
function energy(){ const p=getProfile(), kg=bodyKg(), cm=num(p.height), age=num(p.age), act=num(p.activity);
  const missing=[!p.sex&&"sex",!age&&"age",!cm&&"height",!kg&&"weight",!act&&"activity level"].filter(Boolean);
  if(missing.length) return {missing};
  const mifflin=10*kg+6.25*cm-5*age+(p.sex==="m"?5:-161);
  const bf=num(p.bf), useBf = bf>=3 && bf<=60 && p.bfHow && p.bfHow!=="guess";
  const lbm = bf>=3&&bf<=60 ? kg*(1-bf/100) : null;
  const bmr = useBf ? 370+21.6*lbm : mifflin;
  return {bmr:Math.round(bmr), tdee:Math.round(bmr*act), kg, lbm: lbm&&Math.round(lbm*10)/10, bf, method: useBf?"katch":"mifflin", mifflin:Math.round(mifflin)}; }
// When a session has no usable time (imported, or saved within a few minutes), estimate it from the work done:
// each weight set ≈ 45 s of lifting + that exercise's rest; timed cardio/stations use their own logged time.
function estMinutes(s){
  let sec=0;
  (s.items||[]).forEach(it=>(it.sets||[]).forEach(x=>{ if(x.done===false) return;
    if(it.kind==="w"){ const rest=it.rest ?? getTarget(it.name,it).rest ?? 120; sec+=45+rest; }
    else sec+= x.t || 60; }));
  return sec ? Math.round(sec/60) : 0;
}
function sessionMinutes(s){ // {min, est}: the real time if it's believable, otherwise the estimate
  const est=estMinutes(s), real=s.durationMin||0;
  if(real>=5 || (real>0 && real>=est*0.5)) return {min:Math.min(real,240), est:false};
  return est ? {min:est, est:true} : {min:real, est:false};
}
function sessionKcal(s){
  const kg=bodyKg(); if(!kg) return null;
  const dur=sessionMinutes(s).min;
  const perMin=met=>met*3.5*kg/200; let kcal=0, used=0, hasW=false;
  (s.items||[]).forEach(it=>{ if(it.kind==="w") hasW=true;
    (it.sets||[]).forEach(x=>{ if(!x.done||!x.t) return; const min=x.t/60;
      if(it.kind==="c" && x.d){ const v=x.d/min; const vo2 = v>134 ? 0.2*v+3.5 : 0.1*v+3.5; kcal+=vo2*kg/1000*5*min; used+=x.t; }
      else if(it.kind==="s"){ kcal+=perMin(8)*min; used+=x.t; } }); });
  if(dur){ const left=Math.min(dur,180)*60-used; if(left>0) kcal+=perMin(hasW?4:3)*left/60; }
  return kcal>0 ? Math.round(kcal) : null;
}
function raceSentence(){ const d=raceDate(); if(!d) return ""; const n=daysTo(d); return n>0?`Their event/goal date is in ${n} days.`:"Their event/goal date has passed."; }

// kinds: w = weight×reps, c = distance(m)+time, s = station: load kg, amount, time
const T = (name, kind, sets, extra={}) => ({name, kind, sets, ...extra});
// lo–hi = rep range, rest = seconds, step = kg jump when progressing
const W = (name, sets, lo, hi, rest, step) => T(name,"w",sets,{lo,hi,rest,...(step?{step}:{})});
// Built-in starter programs. People can also build their own or have Claude make one.
const C1=(name,extra={})=>T(name,"c",1,extra);
const PRESETS={
  ppl:{name:"Push / Pull / Legs", short:"PPL", desc:"3 days, or run it twice a week for 6", days:[
    {name:"Push", desc:"Chest · shoulders · triceps", items:[
      W("Bench Press",3,6,8,180), W("Overhead Press",3,6,8,150), W("Incline DB Press",3,8,10,120,2),
      W("Cable Fly",2,10,15,75), W("DB Lateral Raise",3,12,15,75,2), W("Triceps Pushdown",3,10,15,60)]},
    {name:"Pull", desc:"Back · rear delts · biceps", items:[
      W("Pull-Up",3,6,10,150), W("Barbell Row",3,6,8,150), W("Lat Pulldown",3,8,12,120),
      W("Seated Cable Row",2,10,12,90), W("Face Pull",2,12,15,60), W("DB Curl",3,10,12,60,2)]},
    {name:"Legs", desc:"Quads · hamstrings · calves", items:[
      W("Back Squat",3,6,8,180), W("Romanian Deadlift",3,8,10,150), W("Leg Press",3,10,12,150,5),
      W("Leg Curl",3,10,15,90), W("Leg Extension",2,10,15,90), W("Calf Raise",3,10,15,60)]}]},
  ul:{name:"Upper / Lower", short:"Upper/Lower", desc:"4 days: heavier and lighter version of each", days:[
    {name:"Upper 1", desc:"Strength focus", items:[
      W("Bench Press",3,5,7,180), W("Barbell Row",3,6,8,150), W("Overhead Press",2,6,8,150),
      W("Lat Pulldown",3,8,12,120), W("DB Curl",2,10,12,60,2), W("Triceps Pushdown",2,10,15,60)]},
    {name:"Lower 1", desc:"Strength focus", items:[
      W("Back Squat",3,5,7,180), W("Romanian Deadlift",3,8,10,150), W("Leg Press",2,10,12,150,5),
      W("Leg Curl",2,10,15,90), W("Calf Raise",3,10,15,60), W("Hanging Leg Raise",2,10,15,60)]},
    {name:"Upper 2", desc:"Volume focus", items:[
      W("Incline DB Press",3,8,10,120,2), W("Seated Cable Row",3,10,12,90), W("Seated DB Shoulder Press",3,8,10,120,2),
      W("Pull-Up",3,6,10,150), W("DB Lateral Raise",3,12,15,75,2), W("Hammer Curl",2,10,12,60,2)]},
    {name:"Lower 2", desc:"Volume focus", items:[
      W("Deadlift",3,4,6,180,5), W("Bulgarian Split Squat",3,8,10,120,2), W("Leg Extension",2,10,15,90),
      W("Leg Curl",2,10,15,90), W("Calf Raise",3,10,15,60)]}]},
  run:{name:"Run", short:"Run", desc:"4 days: easy, intervals, tempo, long run", days:[
    {name:"Easy Run", desc:"Conversational pace, 20–40 min", items:[C1("Easy Run")]},
    {name:"Intervals", desc:"Warm up, 6 × 400 m fast, cool down", items:[C1("Warm-up Jog"), T("400 m Repeats","c",6,{def:{d:400}}), C1("Cool-down Jog")]},
    {name:"Tempo Run", desc:"Comfortably hard, 15–25 min", items:[C1("Warm-up Jog"), C1("Tempo Run"), C1("Cool-down Jog")]},
    {name:"Long Run", desc:"Easy pace, your longest run of the week", items:[C1("Long Run")]}]},
};
const EMPTY_DAY={id:"empty", name:"Empty session", desc:"Add exercises as you go", items:[]};
function getProgram(){ const p=LS.get("liftlog.program",null); if(!(p&&Array.isArray(p.days)&&p.days.length)) return null;
  if(!p.pid){ p.pid="p"+Date.now().toString(36); try{ localStorage.setItem("liftlog.program",JSON.stringify(p)); }catch(e){} } return p; }
function programDays(){ const p=getProgram(); return p?p.days:[]; }
function tpls(){ return [...programDays(), EMPTY_DAY]; }
const isCardioDay=d=>d.items.length && d.items.some(i=>i.kind!=="w");
const KNOWN = {};
function rebuildKnown(){
  Object.keys(KNOWN).forEach(k=>delete KNOWN[k]);
  Object.assign(KNOWN,{"Hip Thrust":{kind:"w",lo:8,hi:12,rest:120},"Pull-Up":{kind:"w",lo:6,hi:10,rest:150},"Barbell Row":{kind:"w",lo:8,hi:10,rest:120},
   "Bench Press":{kind:"w",lo:6,hi:8,rest:180},"Overhead Press":{kind:"w",lo:6,hi:8,rest:150},"Leg Extension":{kind:"w",lo:10,hi:15,rest:90},
   "Calf Raise":{kind:"w",lo:10,hi:15,rest:60},"Face Pull":{kind:"w",lo:12,hi:15,rest:60},"Hammer Curl":{kind:"w",lo:10,hi:12,rest:60},
   "Assault Bike":{kind:"c"},"Incline Walk":{kind:"c"}});
  const add=i=>{ KNOWN[i.name]={kind:i.kind,unit:i.unit,lo:i.lo,hi:i.hi,rest:i.rest,step:i.step}; };
  Object.values(PRESETS).forEach(p=>p.days.forEach(d=>d.items.forEach(add)));
  programDays().forEach(d=>d.items.forEach(add)); // your program wins
}
/* My programs: every program you create, edit or get from Claude is kept here, so switching never loses one.
   Untouched starter programs aren't stored (they're always in the Starter list). */
function getLib(){ return LS.get("liftlog.programs",[])||[]; }
function saveLib(prog){ if(!prog||!prog.pid||(prog.preset&&!prog.modified)) return; const lib=getLib().filter(x=>x.pid!==prog.pid); lib.unshift({...prog, saved:new Date().toISOString()}); LS.set("liftlog.programs",lib.slice(0,30)); }
function delLib(pid){ LS.set("liftlog.programs",getLib().filter(x=>x.pid!==pid)); }
function installProgram(prog, opts={}){
  const cur=getProgram();
  if(cur && cur.pid!==opts.pid) saveLib(cur);            // keep the one you're leaving
  const days=prog.days.map((d,k)=>({id:"d"+k, name:d.name, desc:d.desc||"", items:d.items.map(i=>({...i}))}));
  const next={pid:opts.pid||("p"+Date.now().toString(36)), preset:opts.preset||null, modified:!!opts.modified, name:prog.name, desc:prog.desc||"", installed:new Date().toISOString(), days};
  LS.set("liftlog.program",next);
  saveLib(next);
  // the program's own sets/reps/rest should apply, so clear older per-exercise target edits for these names
  const tg=LS.get("liftlog.targets",{})||{}; days.forEach(d=>d.items.forEach(i=>delete tg[i.name])); LS.set("liftlog.targets",tg);
  rebuildKnown();
}

// Resolve the target for an exercise: your saved edits > program/template > sensible default
function stepGuess(name){ return /\b(DB|Dumbbell)\b|Lateral|Curl|Fly|Raise/i.test(name) ? 2 : 2.5; }
function getTarget(name, base={}){
  const k=KNOWN[name]||{}, saved=(LS.get("liftlog.targets",{})||{})[name]||{};
  return { lo: saved.lo ?? base.lo ?? k.lo ?? 8, hi: saved.hi ?? base.hi ?? k.hi ?? 12,
           rest: saved.rest ?? base.rest ?? k.rest ?? 120, step: saved.step ?? base.step ?? k.step ?? stepGuess(name),
           sets: saved.sets ?? base.sets ?? null };
}

/* ================== STATE ================== */
let db = null, mode = "loading"; // "db" | "local" | "loading"
let sessions = [];   // [{id,date,name,items,notes,durationMin,comment}]
let weights = [];    // [{id,date,kg}]
let active = null;   // draft session
let sampleFn = null;
const $ = s => document.querySelector(s);

function parseTime(s){ // "m:ss" | "h:mm:ss" | "mm" -> seconds
  s = String(s||"").trim(); if(!s) return null;
  const p = s.split(":").map(Number); if(p.some(isNaN)) return null;
  if(p.length===1) return p[0]*60;
  if(p.length===2) return p[0]*60+p[1];
  return p[0]*3600+p[1]*60+p[2];
}
function fmtTime(sec){ if(sec==null||isNaN(sec)) return "–"; sec=Math.round(sec);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;}
const num = v => { const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; };
const e1rm = (w,r) => (w&&r) ? w*(1+r/30) : 0;
function fmtDate(iso,opts={weekday:"short",day:"numeric",month:"short"}){ return new Date(iso).toLocaleDateString("en-GB",opts); }
function daysTo(d){ return Math.ceil((d - new Date())/86400000); }
function pace(d,t){ if(!d||!t) return null; return t/(d/1000); } // sec per km
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function setSummary(item,set){
  if(item.kind==="w"){ return set.w!=null||set.r!=null ? `${set.w??"BW"}×${set.r??"?"}${set.q!=null?` RIR${set.q}`:""}` : null; }
  if(item.kind==="c"){ if(set.d==null&&set.t==null) return null; const p=pace(set.d,set.t); return `${set.d?(set.d>=1000?(set.d/1000)+"km":set.d+"m"):""}${set.t?" "+fmtTime(set.t):""}${p?" ("+fmtTime(p)+"/km)":""}`.trim(); }
  if(item.kind==="s"){ if(set.a==null&&set.t==null&&set.w==null) return null; return `${set.a??""}${item.unit?" "+item.unit:""}${set.w?" @"+set.w+"kg":""}${set.t?" "+fmtTime(set.t):""}`.trim(); }
}
function lastFor(name, excludeId){
  for(const s of sessions){ if(s.id===excludeId) continue;
    const it=(s.items||[]).find(i=>i.name.toLowerCase()===name.toLowerCase());

// Empty (operating) weights, rounded: Cessna 172 ~762 kg, ATR 72-600 ~13,500 kg (typical in-service), 737-800 ~41,000 kg, 777-300ER ~167,800 kg, A380 ~277,000 kg
const AIRCRAFT=[{n:"Cessna 172",kg:762},{n:"ATR 72",kg:13500},{n:"Boeing 737",kg:41000},{n:"Boeing 777",kg:167800},{n:"Airbus A380",kg:277000}];
// Great-circle distances from Kuala Lumpur (KUL), worked out from airport coordinates
const AIRPORTS={SIN:[1.3644,103.9915],PEN:[5.2971,100.2770],KCH:[1.4847,110.3470],BKK:[13.6900,100.7501],BKI:[5.9372,116.0510],HKG:[22.3080,113.9185],NRT:[35.7720,140.3929],SYD:[-33.9399,151.1753],LHR:[51.4700,-0.4543]};
function gcKm(a,b){ const R=6371, r=x=>x*Math.PI/180, dLat=r(b[0]-a[0]), dLon=r(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
const ROUTES=Object.entries(AIRPORTS).map(([c,ll])=>({c, km:gcKm([2.7456,101.7099],ll)})).sort((a,b)=>a.km-b.km);
const kgParts=n=>{ if(n<1000) return [String(Math.round(n)),"kg"]; const v=(n/1000).toFixed(n>=100000?0:1); return [v==="1.0"?"1":v, (v==="1.0"||v==="1")?"ton":"tons"]; };
const kgfmt=n=>kgParts(n).join(" ");
function blockStat(){ // total training time, pilot-logbook style
  const mins=sessions.reduce((t,s)=>t+sessionMinutes(s).min,0);
  return {k:"🕒", v:`${Math.floor(mins/60)}:${String(Math.round(mins%60)).padStart(2,"0")}`, l:"Block hours", s:`${sessions.length} sector${sessions.length===1?"":"s"} flown`};
}
function liftedStat(){ // headline = real weight lifted; underneath = the same weight in aircraft
  const total=sessions.reduce((t,s)=>t+sessionVolume(s).v,0);
  if(!total) return {k:"🏋", v:"0", u:"kg", l:"Lifted", s:"First target: a Cessna 172"};
  let i=AIRCRAFT.length-1; while(i>=0 && total<AIRCRAFT[i].kg) i--;
  if(i<0) return {k:"🏋", v:kgParts(total)[0], u:kgParts(total)[1], l:"Lifted", s:`${Math.floor(total/AIRCRAFT[0].kg*100)}% of a Cessna 172`};
  const a=AIRCRAFT[i], x=total/a.kg; let n=x<10?x.toFixed(1):String(Math.round(x)); if(n==="1.0") n="1";
  return {k:"🏋", v:kgParts(total)[0], u:kgParts(total)[1], l:"Lifted", s:`≈ ${n} ${a.n}${n==="1"?"":"s"}`};
}
function distanceStat(){
  let m=0; sessions.forEach(s=>(s.items||[]).forEach(i=>{ if(i.kind==="c") (i.sets||[]).forEach(x=>{ if(x.done!==false&&x.d) m+=x.d; }); }));
  const km=m/1000;
  if(!km) return {k:"✈", v:"0 km", l:"Distance flown", s:"Log a run to take off"};
  const nx=ROUTES.find(r=>r.km>km);
  if(!nx){ const far=ROUTES[ROUTES.length-1]; return {k:"✈", v:(km/far.km).toFixed(1)+"×", l:`KUL → ${far.c}`, s:`${Math.round(km).toLocaleString()} km covered`}; }
  return {k:"✈", v:Math.floor(km/nx.km*100)+"%", l:`KUL → ${nx.c}`, s:`${km<100?km.toFixed(1):Math.round(km)} of ${Math.round(nx.km)} km`};
}
function weekStart(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x; }
function weekStreak(){ // weeks in a row with at least one session (this week counts if you've trained, otherwise it starts from last week)
  if(!sessions.length) return 0;
  const weeks=new Set(sessions.map(s=>weekStart(s.date).getTime()));
  let w=weekStart(new Date()); if(!weeks.has(w.getTime())) w=new Date(w.getTime()-7*86400000);
  let n=0; while(weeks.has(w.getTime())){ n++; w=new Date(w.getTime()-7*86400000); } return n;
}

function programJson(){ const p=getProgram(); if(!p) return "(none yet)";

function extractJson(text){
  const fence=text.match(/```(?:json)?\s*([\s\S]*?)```/i); let s=fence?fence[1]:text;
  const a=s.indexOf("{"), b=s.lastIndexOf("}"); if(a<0||b<=a) throw new Error("No JSON block found in what you pasted.");
  return JSON.parse(s.slice(a,b+1));
}
const clampInt=(v,lo,hi,d)=>{ const n=Math.round(num(v)); return isNaN(n)||n==null?d:Math.max(lo,Math.min(hi,n)); };
function fromClaudeEx(e){
  const name=String(e&&e.name||"").trim().slice(0,60); if(!name) throw new Error("An exercise is missing its name.");
  const type=String(e.type||"weight").toLowerCase(), sets=clampInt(e.sets,1,10,3);
  if(type.startsWith("run")||type==="cardio"){ const d=num(e.distance_m); return {name,kind:"c",sets,...(d?{def:{d}}:{})}; }
  if(type.startsWith("station")){ const a=num(e.amount); return {name,kind:"s",sets,unit:String(e.unit).toLowerCase()==="reps"?"reps":"m",...(a?{def:{a}}:{})}; }
  let lo,hi; const m=String(e.reps??"8-12").match(/(\d+)\s*(?:-|–|to)\s*(\d+)/);
  if(m){ lo=+m[1]; hi=+m[2]; } else { lo=hi=clampInt(e.reps,1,50,8); } if(hi<lo) [lo,hi]=[hi,lo];
  const kg=num(e.kg);
  return {name,kind:"w",sets,lo:Math.max(1,lo),hi:Math.min(50,hi),rest:clampInt(e.rest,15,600,120),step:num(e.step)||stepGuess(name),...(kg?{sugW:kg}:{})};
}
function readClaudeReply(text){
  const o=extractJson(text), out={};
  const prog = o.program || (o.days?o:null);
  if(prog){ if(!Array.isArray(prog.days)||!prog.days.length) throw new Error("The program has no days.");
    out.program={name:String(prog.name||"My program").slice(0,60), desc:String(prog.desc||prog.note||"").slice(0,120),
      days:prog.days.slice(0,7).map((d,k)=>{ const ex=(d.exercises||d.items||[]).slice(0,12); if(!ex.length) throw new Error(`Day ${k+1} has no exercises.`);
        return {name:String(d.name||`Day ${k+1}`).slice(0,40), desc:String(d.note||d.desc||"").slice(0,80), items:ex.map(fromClaudeEx)}; })}; }
  const wk = o.workout || (o.exercises?o:null);
  if(wk){ const ex=(wk.exercises||[]).slice(0,15); if(!ex.length) throw new Error("The workout has no exercises.");
    out.workout={name:String(wk.name||"Claude's workout").slice(0,40), items:ex.map(fromClaudeEx)}; }
  if(o.profile&&typeof o.profile==="object") out.profile=o.profile;
  if(Array.isArray(o.baselines)) out.baselines=o.baselines.filter(b=>b&&b.name).slice(0,40);
  if(!out.program&&!out.workout&&!out.profile&&!out.baselines) throw new Error("Couldn't find a profile, program or workout in that reply.");
  return out;
}
function applyProfile(pf){
  const pr=getProfile(); const actMap={sedentary:"1.2",light:"1.375",moderate:"1.55",very:"1.725","very active":"1.725",extreme:"1.9"};
  if(pf.name) pr.name=String(pf.name).slice(0,40);
  if(num(pf.age)) pr.age=String(num(pf.age));
  if(pf.sex){ const s=String(pf.sex).toLowerCase(); if(s.startsWith("m")) pr.sex="m"; else if(s.startsWith("f")) pr.sex="f"; }
  if(num(pf.height_cm)) pr.height=String(num(pf.height_cm));
  if(pf.activity!=null){ const a=String(pf.activity).toLowerCase(); pr.activity = actMap[a] || (ACTIVITY.find(x=>x.v===String(num(a)))||{}).v || pr.activity; }
  if(num(pf.goal_weight_kg)) pr.goalKg=String(num(pf.goal_weight_kg));
  if(num(pf.body_fat_pct)) pr.bf=String(num(pf.body_fat_pct));
  if(["guess","scale","caliper","dexa"].includes(String(pf.body_fat_method||"").toLowerCase())) pr.bfHow=String(pf.body_fat_method).toLowerCase();
  if(num(pf.goal_body_fat_pct)) pr.goalBf=String(num(pf.goal_body_fat_pct));
  if(pf.event) pr.race=String(pf.event).slice(0,60);
  if(/^\d{4}-\d{2}-\d{2}$/.test(pf.event_date||"")) pr.raceDate=pf.event_date;
  if(pf.about) pr.about=String(pf.about).slice(0,2000);
  if(num(pf.weight_kg)) pr.weight=num(pf.weight_kg);
  LS.set("liftlog.profile",pr);
  return num(pf.weight_kg);
}
async function applyReply(r){

}
function replySummary(r){

  if(r.program) parts.push(`<b>Program:</b> ${esc(r.program.name)} (${r.program.days.length} day${r.program.days.length>1?"s":""})${r.program.days.map(dayList).join("")}`);

}

/* ---------- double progression ----------
   Hit the TOP of the rep range on every working set -> add weight next time, reps reset to the bottom.
   Otherwise keep the weight and try to add a rep to each set.
   Below the bottom of the range two sessions running -> suggest a ~10% reset. */
const roundTo=(x,st)=>Math.round(x/st)*st;
function priorSessionsFor(name, excludeId, n=2){
  const out=[]; for(const s of sessions){ if(s.id===excludeId) continue;
    const it=(s.items||[]).find(i=>i.name.toLowerCase()===name.toLowerCase());
    if(it && it.sets.some(x=>x.done)) { out.push({session:s,item:it}); if(out.length>=n) break; } }
  return out;
}
function progressionFor(it){
  if(it.kind!=="w") return null;
  const lo=it.lo??8, hi=it.hi??12, step=it.step??2.5;
  const prev=priorSessionsFor(it.name, active&&active.id, 2);
  if(!prev.length && it.sugW){ const want=Math.max(it.sets.length,1); return {state:"base", msg:`Claude suggests ${it.sugW} kg for ${lo}–${hi} reps.`, sug:Array.from({length:want},()=>({w:it.sugW,r:lo}))}; }
  if(!prev.length){
    const b=getBaseline(it.name), want=Math.max(it.sets.length,1);
    if(!b || (b.w==null && b.r==null)) return {state:"new", msg:`No baseline yet — pick a weight you could lift for about 2 more reps than ${hi}, or set it on the Profile page.`, sug:[]};
    const fill=o=>Array.from({length:want},()=>o);
    if(b.w==null) return {state:"base", msg:`From your baseline: ${b.r} reps. Aim for ${Math.min(hi,b.r)}+ each set.`, sug:fill({r:Math.min(hi,b.r)})};
    if(b.r==null) return {state:"base", msg:`From your baseline: start at ${b.w} kg and aim for ${lo}–${hi} reps.`, sug:fill({w:b.w,r:lo})};
    if(b.r>=hi){ const nw=+(b.w+step).toFixed(2); return {state:"up", msg:`Baseline ${b.w}×${b.r} already hits the top of ${lo}–${hi} → start at ${nw} kg for ${lo}+ reps.`, sug:fill({w:nw,r:lo})}; }
    if(b.r<lo){ const nw=Math.max(step,roundTo(b.w*0.9,step)); return {state:"hold", msg:`Baseline ${b.w}×${b.r} is under ${lo} reps → start lighter at ${nw} kg and aim for ${lo}+.`, sug:fill({w:nw,r:lo})}; }
    return {state:"base", msg:`From your baseline: ${b.w} kg × ${b.r}. Match it on every set, then build to ${hi}.`, sug:fill({w:b.w,r:b.r})};
  }
  const sets=prev[0].item.sets.filter(x=>x.done && x.r!=null);
  if(!sets.length) return null;
  const bw = sets.every(x=>!x.w);
  const topW=Math.max(...sets.map(x=>x.w||0));
  const work=sets.filter(x=>(x.w||0)===topW);
  const want=Math.max(it.sets.length,1);
  const allTop = work.length>=Math.min(want,sets.length) && work.every(x=>x.r>=hi);
  const below = work.some(x=>x.r<lo);
  if(bw){
    if(allTop) return {state:"up", msg:`All sets hit ${hi}. Add load (vest, plate, DB) or a harder variation.`, sug:work.map(()=>({r:hi}))};
    return {state:"reps", msg:`Beat last time: +1 rep per set, up to ${hi}.`, sug:work.map(x=>({r:Math.min(hi,x.r+1)}))};
  }
  if(allTop){ const nw=+(topW+step).toFixed(2);
    return {state:"up", msg:`Hit ${hi} on every set last time → go up to ${nw} kg and aim for ${lo}+ reps.`, sug:Array.from({length:want},()=>({w:nw,r:lo}))}; }
  if(below){
    const prevBelow = prev[1] && (()=>{ const ps=prev[1].item.sets.filter(x=>x.done&&x.r!=null); const tw=Math.max(...ps.map(x=>x.w||0)); if(tw!==topW) return false;
      const pw=ps.filter(x=>(x.w||0)===tw); const tot=a=>a.reduce((n,x)=>n+x.r,0);
      return pw.some(x=>x.r<lo) && tot(work) <= tot(pw); })();
    if(prevBelow){ const nw=Math.max(step,roundTo(topW*0.9,step));
      return {state:"down", msg:`Under ${lo} reps two sessions running at ${topW} kg → reset to ${nw} kg and build back up.`, sug:Array.from({length:want},()=>({w:nw,r:hi-1}))}; }
    return {state:"hold", msg:`Fell short of ${lo} last time → stay at ${topW} kg and aim for ${lo}+ on every set.`, sug:Array.from({length:want},(_,j)=>({w:topW,r:Math.max(lo,(work[j]||work[work.length-1]).r)}))};
  }
  return {state:"reps", msg:`Stay at ${topW} kg and add a rep per set (range ${lo}–${hi}).`, sug:Array.from({length:want},(_,j)=>({w:topW,r:Math.min(hi,((work[j]||work[work.length-1]).r)+1)}))};
}

      <br>${en.method==="katch"?`BMR uses your lean mass (Katch-McArdle). Standard formula would give ${en.mifflin}.`:en.lbm?`BMR uses the standard formula (Mifflin-St Jeor) because your body fat % is a guess. Pick how it was measured to use it.`:`BMR uses the standard formula (Mifflin-St Jeor).`}

function setRow(it,i,s,j,ph){

  const doc={ date:active.date, name:active.name||"Session", items, notes:active.notes||"", durationMin:Math.round((Date.now()-active.startedAt)/60000) };
  const id=active.id;

  try{ await putSession(id,doc); }
  catch(e){ btn.disabled=false; btn.textContent="Finish & save"; showBanner(e&&e.code==="quota_exceeded" ? "Storage is full — delete some old sessions and try again." : "Couldn't save just now. Your draft is kept on this phone — try again in a moment."); return; }

/* ---------- keep program days in step with what you actually do ---------- */
function dayChanges(sess){
  if(!sess||!sess.dayId) return null;
  const prog=getProgram(); if(!prog||(sess.pid&&sess.pid!==prog.pid)) return null;
  const day=prog.days.find(d=>d.id===sess.dayId); if(!day) return null;
  const key=n=>String(n||"").trim().toLowerCase();
  const now=sess.items.filter(i=>(i.name||"").trim()), was=day.items;
  const nowK=now.map(i=>key(i.name)), wasK=was.map(i=>key(i.name));
  const added=now.filter(i=>!wasK.includes(key(i.name))).map(i=>i.name);
  const removed=was.filter(i=>!nowK.includes(key(i.name))).map(i=>i.name);
  const common=nowK.filter(k=>wasK.includes(k)), commonWas=wasK.filter(k=>nowK.includes(k));
  const reordered=common.join("|")!==commonWas.join("|");
  if(!added.length&&!removed.length&&!reordered) return null;
  return {day, sess, now, added, removed, reordered};
}

function addDayToProgram(name, items){

/* Every session shows the same four stats in the same order: time · calories · lifted · distance ("–" when it doesn't apply). */
function sessionStats(s){
  const {v,sets}=sessionVolume(s); let m=0, pm=0, pt=0, hasW=false, hasC=false;
  (s.items||[]).forEach(i=>{ if(i.kind==="w" && (i.sets||[]).some(x=>x.done!==false)) hasW=true;
    if(i.kind==="c") (i.sets||[]).forEach(x=>{ if(x.done===false) return; hasC=true; if(x.d) m+=x.d; if(x.d&&x.t){ pm+=x.d; pt+=x.t; } }); });
  const tm=sessionMinutes(s);
  return {min:tm.min, est:tm.est, kcal:sessionKcal(s), kg:v, km:m/1000, sets, hasW, hasC, pace: pm?pt/(pm/1000):null};
}

    "Pull-Up":0,"Barbell Row":50,"Lat Pulldown":45,"Seated Cable Row":45,"Face Pull":15,"DB Curl":10,
    "Back Squat":70,"Romanian Deadlift":60,"Leg Press":100,"Leg Curl":35,"Leg Extension":35,"Calf Raise":60};
  const days=PRESETS.ppl.days, st={};
  // plan: day offset from today (positive = days ago) → what was done. Gaps, doubles and a missed stretch built in.
  const plan=[[30,"Push"],[29,"run"],[28,"Pull"],[26,"Legs"],[25,"run"],[23,"Push"],[22,"Pull"],[20,"Legs"],[19,"run"],
    [16,"Push",{bad:1}],[15,"Pull"],[13,"Legs",{bad:1}],[12,"run",{slow:1}],[9,"Push"],[8,"Pull"],[7,"Legs"],[6,"run"],
    [4,"Push",{deload:1}],[3,"Pull"],[2,"run"],[1,"Legs"],[0,"Push"]];
  const out=[], now=new Date();
  plan.forEach(([ago,what,f={}],n)=>{
    const d=new Date(now); d.setDate(d.getDate()-ago); d.setHours(ago%2?7:18, ago%3?15:40,0,0);
    if(what==="run"){
      const km = f.slow?5 : ({1:5,4:6,8:5,16:10,19:6})[n]||5, pace = (f.slow?372:345) - Math.round(n*1.6) + Math.round(rnd()*10-5);
      out.push({id:"demo_"+n,date:d.toISOString(),name:km>=8?"Long run":"Easy run",notes:"",durationMin:Math.round(km*pace/60),
        items:[{name:km>=8?"Long Run":"Easy Run",kind:"c",sets:[{done:true,d:km*1000,t:km*pace}]},
          ...(n===8||n===19||n===4?[{name:"SkiErg",kind:"s",unit:"m",sets:[{done:true,a:1000,t:({4:262,8:251,19:244})[n]}]},
            {name:"Wall Balls",kind:"s",unit:"reps",sets:[{done:true,a:100,w:6,t:({4:398,8:412,19:371})[n]}]}]:[])]});
      return;
    }
    const day=days.find(x=>x.name===what); let mins=0;
    const items=day.items.map(it=>{
      const s=st[it.name] || (st[it.name]={w:START[it.name]??20, r:it.lo});
      const step=it.step || (it.name.match(/Squat|Deadlift|Leg Press/)?5:2.5);
      const w=f.deload? Math.max(0,Math.round(s.w*0.9/step)*step) : s.w;
      const sets=Array.from({length:it.sets},(_,j)=>{
        let r=s.r - (j===it.sets-1&&rnd()<0.5?1:0) - (j>0&&rnd()<0.3?1:0) - (f.bad?1+Math.round(rnd()):0);
        r=Math.max(it.lo-2,Math.min(it.hi,r)); const q=f.deload?3:Math.max(0,Math.min(3,Math.round(2-(j*0.7)-(f.bad?1:0)+rnd()*0.6)));
        mins+=(45+(it.rest||90))/60; return it.name==="Pull-Up"?{done:true,r,q}:{done:true,w,r,q};
      });
      if(!f.deload && !f.bad){ const jump=1+(rnd()<0.4?1:0);
        if(it.name==="Pull-Up") s.r=Math.min(it.hi,s.r+(rnd()<0.6?1:0));
        else if(sets[0].r>=it.hi){ s.w+=step; s.r=it.lo; } else s.r=Math.min(it.hi,s.r+jump); }
      return {name:it.name,kind:"w",lo:it.lo,hi:it.hi,sets};
    });

  });

}

  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*(w-4)+2).toFixed(1)},${(h-2-(v-mn)/rg*(h-4)).toFixed(1)}`).join(" ");
  const last=pts.split(" ").pop().split(",");

}

function liftHistory(name){ // oldest → newest, one entry per session that did this lift
  const out=[];
  [...sessions].reverse().forEach(s=>(s.items||[]).forEach(it=>{
    if(it.kind!=="w"||it.name!==name) return;
    const sets=(it.sets||[]).filter(x=>x.done!==false && (x.r||x.w)); if(!sets.length) return;
    const top=sets.reduce((a,b)=>((b.w||0)>(a.w||0)||((b.w||0)===(a.w||0)&&(b.r||0)>(a.r||0)))?b:a);
    const best1=Math.max(0,...sets.map(x=>e1rm(x.w,x.r)));
    out.push({id:s.id, date:s.date, sets, top, e1:best1, item:it});
  }));
  return out;
}
function loadText(x){ return x.w?`${x.w} kg × ${x.r??"?"}`:`${x.r??"?"} reps`; }

function bigChart(series, w=340, hgt=150, opt={}){ // series: [{vals:[...], color, dash}] sharing one x axis
  const all=series.flatMap(s=>s.vals).filter(v=>v!=null); if(all.length<1) return "";
  let mn=Math.min(...all), mx=Math.max(...all); if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const n=Math.max(...series.map(s=>s.vals.length)), X=i=> n<2? w/2 : 12+i*(w-24)/(n-1), Y=v=> opt.invert ? 12+(v-mn)/(mx-mn)*(hgt-30) : hgt-18-(v-mn)/(mx-mn)*(hgt-30);
  const grid=[0,0.5,1].map(f=>{ const v=mn+(mx-mn)*f; return `<line x1="0" x2="${w}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2e37" stroke-width="1"/><text x="${w}" y="${Y(v)-3}" fill="#8b92a1" font-size="10" text-anchor="end">${opt.fmt?opt.fmt(v):Math.round(v)}</text>`; }).join("");
  const lines=series.map(s=>{ const pts=s.vals.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean);
    return `<polyline points="${pts.join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash?'stroke-dasharray="5 4"':""} stroke-linejoin="round" stroke-linecap="round"/>`+
      s.vals.map((v,i)=>v==null?"":`<circle cx="${X(i)}" cy="${Y(v)}" r="${s.dash?2:3.2}" fill="${s.color}"/>`).join(""); }).join("");
  return `<svg viewBox="0 0 ${w} ${hgt}" width="100%" style="display:block">${grid}${lines}</svg>`;
}

const isRunName=n=>/run|jog|repeats|treadmill/i.test(n||"");
function kmTxt(m){ return m>=1000? (Math.round(m/100)/10)+" km" : Math.round(m)+" m"; }
function runSummaryHtml(){
  const now=Date.now(), DAY=86400000, runs=[];
  [...sessions].reverse().forEach(s=>(s.items||[]).forEach(it=>{ if(it.kind!=="c"||!isRunName(it.name)) return;
    let d=0,t=0; (it.sets||[]).forEach(x=>{ if(x.done!==false&&x.d){ d+=x.d; if(x.t) t+=x.t; } }); if(d) runs.push({date:s.date,d,t:t||null}); }));
  if(!runs.length) return "";
  const r30=runs.filter(r=>now-new Date(r.date)<30*DAY), use=r30.length?r30:runs, timed=use.filter(r=>r.t);
  const avg=timed.length? timed.reduce((a,r)=>a+r.t,0)/(timed.reduce((a,r)=>a+r.d,0)/1000) : null;
  const dist=use.reduce((a,r)=>a+r.d,0), longest=use.reduce((a,r)=>r.d>a.d?r:a), fastest=timed.length?timed.reduce((a,r)=>r.t/r.d<a.t/a.d?r:a):null;
  const wkStart=new Date(); wkStart.setHours(0,0,0,0); wkStart.setDate(wkStart.getDate()-((wkStart.getDay()+6)%7));
  const wkKm=runs.filter(r=>new Date(r.date)>=wkStart).reduce((a,r)=>a+r.d,0);
  // trend: average pace of the newer half vs older half of the period
  let trend=""; if(timed.length>=4){ const half=Math.floor(timed.length/2), P=a=>a.reduce((x,r)=>x+r.t,0)/(a.reduce((x,r)=>x+r.d,0)/1000);
    const diff=Math.round(P(timed.slice(0,half))-P(timed.slice(half)));
    trend = diff>=3?`<span class="rtr up">▲ ${fmtTime(diff)}/km faster lately</span>`: diff<=-3?`<span class="rtr down">▼ ${fmtTime(-diff)}/km slower lately</span>`:`<span class="rtr eq">Holding steady</span>`; }
  const spk = timed.length>1 ? spark(timed.map(r=>-r.t/(r.d/1000)),120,40,"#6ab0ff") : "";
  return `<div class="runbox">
    <div class="rhead"><span>🏃 Summary</span><span class="muted">${r30.length?"Last 30 days":"All time"} · ${use.length} run${use.length===1?"":"s"}</span></div>
    <div class="rmain"><div><small>Avg pace</small><b>${avg?fmtTime(Math.round(avg)):"–"}<i>/km</i></b>${trend}</div><div class="rspk">${spk}</div></div>
    <div class="rgrid">
      <div><small>Distance</small><b>${kmTxt(dist)}</b></div>
      <div><small>This week</small><b>${wkKm?kmTxt(wkKm):"0 km"}</b></div>
      <div><small>Longest</small><b>${kmTxt(longest.d)}</b></div>
      <div><small>Fastest</small><b>${fastest?fmtTime(Math.round(fastest.t/(fastest.d/1000))):"–"}<i>/km</i></b></div>
    </div></div>`;
}
function cardioHistory(name){ // oldest → newest
  const out=[];
  [...sessions].reverse().forEach(s=>(s.items||[]).forEach(it=>{ if(it.name!==name||it.kind==="w") return;
    const sets=(it.sets||[]).filter(x=>x.done!==false); if(!sets.length) return;
    if(it.kind==="c"){ let d=0,t=0; sets.forEach(x=>{ if(x.d){ d+=x.d; if(x.t) t+=x.t; } }); if(!d) return;
      out.push({id:s.id,date:s.date,kind:"c",d,t:t||null,p:t?t/(d/1000):null,n:sets.length}); }

      out.push({id:s.id,date:s.date,kind:"s",t:b.t||null,a:b.a,w:b.w,unit:it.unit,n:sets.length}); }

}

  Arms:["DB Curl","Barbell Curl","Hammer Curl","Preacher Curl","Cable Curl","Triceps Pushdown","Overhead Triceps Extension","Skull Crusher","Close-Grip Bench Press"],
  Core:["Hanging Leg Raise","Cable Crunch","Ab Wheel","Pallof Press","Decline Sit-Up"],
  Cardio:["Run","Easy Run","Tempo Run","Long Run","400 m Repeats","1 km Runs","Treadmill Run","Incline Walk","Rowing","Bike","Assault Bike","Stair Climber","Swim","Jump Rope","Warm-up Jog","Cool-down Jog"],
  Stations:["SkiErg","Row","Sled Push","Sled Pull","Burpee Broad Jumps","Farmers Carry","Sandbag Lunges","Wall Balls","Burpees","Box Jumps","Kettlebell Swings","Thrusters"]};
const STATION_REPS=["Wall Balls","Burpees","Box Jumps","Kettlebell Swings","Thrusters"];
function exInfo(name){
  const k=KNOWN[name]; if(k) return {kind:k.kind, unit:k.unit};
  if(CATALOG.Cardio.includes(name)) return {kind:"c"};
  if(CATALOG.Stations.includes(name)) return {kind:"s", unit:STATION_REPS.includes(name)?"reps":"m"};
  return {kind:"w"};
}
function yourExercises(){ const seen=new Set(), out=[];
  sessions.forEach(s=>(s.items||[]).forEach(i=>{ if(!seen.has(i.name)){ seen.add(i.name); out.push(i.name); } }));
  programDays().forEach(d=>d.items.forEach(i=>{ if(!seen.has(i.name)){ seen.add(i.name); out.push(i.name); } }));
  return out; }
function lockScroll(on){ document.body.classList.toggle("locked", !!on); }
function pickExercise({title="Choose exercise", only=null, onPick}){
  const cats=Object.keys(CATALOG).filter(c=>!only || (only==="w" ? !["Cardio","Stations"].includes(c) : true));
  let q="", cat="All";
  const ok=n=>!only || exInfo(n).kind===only;
  const r=document.createElement("div"); r.className="picker";
  r.innerHTML=`<div class="pk">
    <div class="row" style="padding:14px 16px 8px"><h3 class="sp" style="margin:0">${esc(title)}</h3><button class="iconbtn" data-pkx>✕</button></div>
    <div style="padding:0 16px"><input id="pkQ" placeholder="Search or type a new exercise…" autocomplete="off"></div>
    <div class="pkcats">${["All",...(yourExercises().filter(ok).length?["Yours"]:[]),...cats].map(c=>`<button class="chip ${c==="All"?"on":""}" data-pkc="${c}">${c}</button>`).join("")}</div>
    <div class="plist" id="pkL"></div></div>`;
  document.body.appendChild(r); lockScroll(true);
  const close=()=>{ r.remove(); if(!document.querySelector(".picker") && !$("#modalRoot").innerHTML) lockScroll(false); };
  const choose=(name,kind,unit)=>{ close(); onPick(name.trim().slice(0,60), kind, unit); };
  const item=n=>`<button class="pki" data-pkn="${esc(n)}"><span>${esc(n)}</span><small>${({w:"",c:"cardio",s:"station"})[exInfo(n).kind]}</small></button>`;
  const draw=()=>{
    const L=$("#pkL"), ql=q.trim().toLowerCase(); let html="";
    if(ql){
      const all=[...new Set([...yourExercises(), ...Object.values(CATALOG).flat(), ...Object.keys(KNOWN)])].filter(ok);
      const hits=all.filter(n=>n.toLowerCase().includes(ql)).sort((a,b)=>a.toLowerCase().indexOf(ql)-b.toLowerCase().indexOf(ql));
      if(!hits.some(n=>n.toLowerCase()===ql)){
        const nm=q.trim();
        html+=`<div class="pknew"><div>＋ Add “<b>${esc(nm)}</b>” as</div><div class="row" style="gap:6px;margin-top:8px">
          <button class="btn small primary" data-pknew="w">Weights</button>${only?"":`<button class="btn small" data-pknew="c">Cardio</button><button class="btn small" data-pknew="s">Station</button>`}</div></div>`; }
      html+=hits.map(item).join("")||"";
    } else {
      const sec=(t,list)=>list.length?`<div class="pkh">${t}</div>${list.map(item).join("")}`:"";
      if(cat==="All"||cat==="Yours") html+=sec("Your exercises", yourExercises().filter(ok).slice(0, cat==="Yours"?200:12));
      (cat==="All"?cats:cats.filter(c=>c===cat)).forEach(c=>{ html+=sec(c, CATALOG[c].filter(ok)); });
    }
    L.innerHTML=html||`<div class="empty">Nothing found.</div>`; L.scrollTop=0;
    L.querySelectorAll("[data-pkn]").forEach(b=>b.onclick=()=>{ const n=b.dataset.pkn, x=exInfo(n); choose(n,x.kind,x.unit); });
    L.querySelectorAll("[data-pknew]").forEach(b=>b.onclick=()=>{ const kd=b.dataset.pknew; choose(q, kd, kd==="s"?"m":undefined); });
  };
  r.querySelector("#pkQ").oninput=e=>{ q=e.target.value; draw(); };
  r.querySelectorAll("[data-pkc]").forEach(b=>b.onclick=()=>{ cat=b.dataset.pkc; q=""; r.querySelector("#pkQ").value=""; r.querySelectorAll("[data-pkc]").forEach(x=>x.classList.toggle("on",x===b)); draw(); });
  r.querySelector("[data-pkx]").onclick=close;
  r.onclick=e=>{ if(e.target===r) close(); };
  draw();
}
function modal(html){ const r=$("#modalRoot"); r.innerHTML=`<div class="modal">${html}</div>`; lockScroll(true); const m=r.firstElementChild; m.onclick=e=>{ if(e.target===m) closeModal(); }; m.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal); }
function closeModal(){ try{coachAbort?.abort()}catch(e){} $("#modalRoot").innerHTML=""; if(!document.querySelector(".picker")) lockScroll(false); }
function confirmDlg(msg,okLabel,onOk,single=false){
  const r=document.createElement("div"); r.className="modal center"; r.style.alignItems="center";
  r.innerHTML=`<div class="dlg"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end;gap:8px">${single?"":`<button class="btn small" data-x>Cancel</button>`}<button class="btn small ${single?"primary":"danger"}" data-ok>${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(r);
  r.querySelector("[data-ok]").onclick=()=>{ r.remove(); onOk(); };
  const x=r.querySelector("[data-x]"); if(x) x.onclick=()=>r.remove();
  r.onclick=e=>{ if(e.target===r) r.remove(); };
}
function showBanner(t){ const b=$("#banner"); b.textContent=t; b.classList.remove("hidden"); clearTimeout(showBanner._t); showBanner._t=setTimeout(()=>{ b.classList.add("hidden"); },6000); }

mode="local";

if("serviceWorker" in navigator && location.protocol.startsWith("http")){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
