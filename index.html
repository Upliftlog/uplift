        <div class="sp"><b>@${esc(r.name)}${r.uid===me?' <span class="you">you</span>':""}</b><div class="bar"><i style="width:${Math.max(4,r[lbMetric]/max*100)}%"></i></div></div>
        <div class="v">${M.f(r[lbMetric])}${M.u}</div></div>`).join("")
      :`<div class="muted" style="font-size:13px;padding:14px 4px;text-align:center">Nobody's trained yet this week. Be the first on the board 💪</div>`}
      ${last?`<div class="lbl">Last week's ${M.l.toLowerCase()} leader: <b>@${esc(last.name)}</b> · ${M.f(last[lbMetric])}${M.u}</div>`:""}
    </div>
    <div class="row" style="margin:20px 2px 10px;align-items:center"><h2 class="sp" style="margin:0">Activity</h2>${preview?"":`<button class="lnk" id="frRefresh" style="font-size:13px">${friendsLoading?"Loading…":"↻ Refresh"}</button>`}</div>
    ${friendsErr&&!preview?`<div class="banner">${esc(friendsErr)}</div>`:""}
    ${!preview&&!shareOn()?`<div class="banner">You're not sharing your sessions, so friends can't see yours. Turn it on in Profile → Account.</div>`:""}
    ${C.feed.length?(()=>{ const today=new Date(); today.setHours(0,0,0,0); const yest=new Date(today); yest.setDate(yest.getDate()-1);
      const dayLabel=d=>{ const x=new Date(d); x.setHours(0,0,0,0); return +x===+today?"Today":+x===+yest?"Yesterday":fmtDate(d,{weekday:"short",day:"numeric",month:"short"}); };
      const groups=[]; C.feed.forEach(f=>{ const l=dayLabel(f.started_at); let g=groups[groups.length-1]; if(!g||g.l!==l) groups.push(g={l,items:[]}); g.items.push(f); });
      return groups.map(g=>`<div class="fday">${g.l}</div><div class="card flist">${g.items.map(f=>{ const k=kc(f.user_id,f.session_id).length, my=mine(f.user_id,f.session_id), self=f.user_id===me;
        const stats=[f.kg&&kgParts(+f.kg).join(" "), f.km&&`${(+f.km).toFixed(1)} km`, f.minutes&&(f.minutes>=100?Math.floor(f.minutes/60)+"h "+String(f.minutes%60).padStart(2,"0"):f.minutes+" min"), f.pace_s&&!f.kg&&`${fmtTime(f.pace_s)}/km`].filter(Boolean);
        return `<div class="fr">${avHtml(f.avatar_e,f.avatar_c,f.username)}
          <div class="sp fb"><div class="fl1"><b>${self?"You":esc(f.username||"friend")}</b><span class="dot ${f.kind}"></span><span class="fs">${esc(f.title)}</span></div>
            <div class="fl2">${stats.map(esc).join(" · ")}${f.highlight&&f.kind!=="cardio"?`<span class="fhl2">★ ${esc(f.highlight)}</span>`:""}</div></div>
          <button class="kd2 ${my?"on":""}" data-kudo="${f.user_id}|${esc(f.session_id)}" ${self?"disabled":""} aria-label="Kudos">🔥${k?`<span>${k}</span>`:""}</button></div>`; }).join("")}</div>`).join(""); })()
    :`<div class="card muted" style="font-size:13px;text-align:center;padding:20px">No activity yet. Finished sessions from everyone in the group show up here.</div>`}
    <div class="muted" style="font-size:11.5px;line-height:1.45;margin:14px 4px 0">Friends see each session's name, time, tons or km and one highlight, never your notes, weigh-ins or full workouts. ${C.at&&!preview?`Updated ${agoText(C.at)}.`:""}</div>`;
  el.querySelectorAll("[data-auth]").forEach(b=>b.onclick=()=>openAuthSheet(b.dataset.auth));
  el.querySelectorAll("[data-avpick]").forEach(b=>b.onclick=openAvatarPicker);
  el.querySelectorAll("[data-lbm]").forEach(b=>b.onclick=()=>{ lbMetric=b.dataset.lbm; renderFriends(); });
  const rf=$("#frRefresh"); if(rf) rf.onclick=()=>{ loadFriends(); renderFriends(); };
  el.querySelectorAll("[data-kudo]").forEach(b=>b.onclick=()=>toggleKudo(...b.dataset.kudo.split("|")));
}
async function toggleKudo(owner,sid){
  const pv=!signedIn(), C=pv?previewCache:friendsCache; if(!C) return; const me=pv?C.me:getAuth().user.id;
  const had=C.kudos.some(k=>k.user_id===me&&k.owner_id===owner&&k.session_id===sid);
  C.kudos = had ? C.kudos.filter(k=>!(k.user_id===me&&k.owner_id===owner&&k.session_id===sid)) : C.kudos.concat({user_id:me,owner_id:owner,session_id:sid});
  renderFriends(); if(pv) return;
  try{
    if(had) await api(`/rest/v1/kudos?user_id=eq.${me}&owner_id=eq.${owner}&session_id=eq.${encodeURIComponent(sid)}`,{method:"DELETE"});
    else await api("/rest/v1/kudos",{method:"POST",headers:{Prefer:"return=minimal,resolution=ignore-duplicates"},body:JSON.stringify([{user_id:me,owner_id:owner,session_id:sid}])});
    LS.set("liftlog.friendsCache",C);
  }catch(e){ showBanner("Couldn't save kudos: "+e.message); loadFriends(); }
}

const FAQ=[
  ["Too lazy to log? Use a screenshot","Let Claude do the typing for you:<ol class=\"steps\"><li>On <b>Log</b>, tap <b>＋ Add a past session</b>.</li><li>Optionally jot a note in the box, e.g. <i>“legs yesterday”</i> or <i>“bench 60kg 3×8”</i>. Leave it empty if the screenshot says it all.</li><li>Tap <b>Copy for Claude</b>, then <b>Open Claude</b> and start a new chat.</li><li>Paste the prompt, then attach your screenshot(s): an Apple Watch, Garmin or Samsung Health summary, a gym app, or a photo of your notebook or whiteboard. Send.</li><li>Copy Claude's <b>whole</b> reply, including the code block, and paste it into step 2 back in the app.</li><li>Tap <b>Read reply</b>, check the date and numbers in the preview, then <b>Save to history</b>.</li></ol><b>Tips:</b> several screenshots or workouts at once is fine, as each becomes its own session. Claude uses the date on the screenshot, or today if there isn't one, and it leaves out anything it can't read rather than guessing. Pasting the same reply twice won't create duplicates, and you can fix anything afterwards with <b>✎ Edit</b>."],

/* ---------- updates: when a new version is uploaded, offer a one-tap refresh ---------- */
let wantReload=false;
function showUpdateBar(worker){
  if(document.querySelector(".updbar")) return;
  const b=document.createElement("div"); b.className="updbar";
  b.innerHTML=`<span>✨ <b>New version ready</b><small>${active?"Your workout in progress is saved.":"Refresh to get the latest features."}</small></span><button class="btn small primary" id="updGo">Refresh</button><button class="iconbtn" id="updX" aria-label="Later">✕</button>`;
  document.body.appendChild(b);
  $("#updGo").onclick=()=>{ $("#updGo").textContent="Updating…"; wantReload=true; try{ worker.postMessage("skipWaiting"); }catch(e){} setTimeout(()=>location.reload(),2500); };
  $("#updX").onclick=()=>b.remove();
}
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(wantReload){ wantReload=false; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then(reg=>{
    if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg.waiting);
    reg.addEventListener("updatefound",()=>{ const nw=reg.installing; if(nw) nw.addEventListener("statechange",()=>{ if(nw.state==="installed" && navigator.serviceWorker.controller) showUpdateBar(nw); }); });
    const check=()=>reg.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(); });
    setInterval(check,30*60*1000);
  }).catch(()=>{});
}

function showUpdateCard(){ // a small card after an update; stays until opened or dismissed, then never again for this version
  const n=PATCH_NOTES[APP.build]; if(!n||document.querySelector(".updcard")) return;
  const heads=n.groups.flatMap(g=>g[1]).slice(0,3).map(x=>x[0]+" "+x[1]);
  const more=n.groups.flatMap(g=>g[1]).length-heads.length;
  const c=document.createElement("div"); c.className="updcard"; c.setAttribute("role","status");
  c.innerHTML=`<button class="ucx" aria-label="Dismiss">✕</button>
    <div class="uct"><span>✦</span><b>Updated to v${APP.version}</b></div>
    <div class="ucl">${heads.map(t=>`<div>${esc(t)}</div>`).join("")}${more>0?`<div class="muted">+ ${more} more</div>`:""}</div>
    <button class="btn small primary ucgo">See what's new</button>`;
  const done=()=>{ LS.set("liftlog.notesSeen",APP.build); c.classList.add("out"); setTimeout(()=>c.remove(),250); };
  c.querySelector(".ucx").onclick=done;
  c.querySelector(".ucgo").onclick=()=>{ done(); openWhatsNew(false); };
  document.body.appendChild(c); requestAnimationFrame(()=>c.classList.add("in"));
}
(()=>{ const seen=LS.get("liftlog.seenBuild",null);
  if(seen && seen<APP.build) LS.set("liftlog.notesDue",APP.build);   // only people updating from an older version, not brand-new users
