<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<script>try{var t=JSON.parse(localStorage.getItem("liftlog.theme")||'"auto"');if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>UP/LIFT</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f12; --panel:#17191e; --panel2:#1f2229; --line:#2a2e37;
  --text:#eef0f4; --muted:#8b92a1; --accent:#ff7a1a; --accentInk:#141414;
  --good:#3ddc84; --bad:#ff5d5d; --blue:#6ab0ff;
  --r:14px;

  --text2:#c9cdd6; --ph:#5b6170; --bar:rgba(14,15,18,.92); --soft:rgba(255,255,255,.04); --soft2:rgba(0,0,0,.22);
  --oBg:#24180f; --oB:#5a3416; --oT:#efe7df; --gBg:#14271d; --gB:#1f5a3a; --gT:#8ff0b6; --rBg:#2b1717; --rT:#ffaaaa; --bBg:#16223a; --bT:#a9cdff;
  --cBg:#1f1813; --cB:#4d2e14; --cT:#e8e4df; --hBg:#1a1d24; --hLine:#2d323c; --bGlow1:rgba(106,176,255,.14); --bGlow2:rgba(106,176,255,.05);
  color-scheme:dark;
}
:root[data-theme="light"]{--bg:#f3f4f6; --panel:#ffffff; --panel2:#eef0f3; --line:#dde1e7;
  --text:#14161b; --muted:#687080; --text2:#3c4250; --ph:#9aa1ad; --accent:#f2700f; --accentInk:#141414;
  --good:#17a052; --bad:#d63c3c; --blue:#2f7fd9;
  --bar:rgba(243,244,246,.92); --soft:rgba(0,0,0,.035); --soft2:rgba(255,255,255,.7);
  --oBg:#fff2e7; --oB:#f3c49c; --oT:#6e3a10; --gBg:#e5f6ec; --gB:#9fd9b8; --gT:#136b3a; --rBg:#fdeaea; --rT:#9c2424; --bBg:#e8f1fd; --bT:#1d4f8f;
  --cBg:#fff6ee; --cB:#f0d0b0; --cT:#3a2a1c; --hBg:#ffffff; --hLine:#e1e4ea; --bGlow1:rgba(47,127,217,.12); --bGlow2:rgba(47,127,217,.03);
  color-scheme:light;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]):not([data-theme="light"]){--bg:#f3f4f6; --panel:#ffffff; --panel2:#eef0f3; --line:#dde1e7;
  --text:#14161b; --muted:#687080; --text2:#3c4250; --ph:#9aa1ad; --accent:#f2700f; --accentInk:#141414;
  --good:#17a052; --bad:#d63c3c; --blue:#2f7fd9;
  --bar:rgba(243,244,246,.92); --soft:rgba(0,0,0,.035); --soft2:rgba(255,255,255,.7);
  --oBg:#fff2e7; --oB:#f3c49c; --oT:#6e3a10; --gBg:#e5f6ec; --gB:#9fd9b8; --gT:#136b3a; --rBg:#fdeaea; --rT:#9c2424; --bBg:#e8f1fd; --bT:#1d4f8f;
  --cBg:#fff6ee; --cB:#f0d0b0; --cT:#3a2a1c; --hBg:#ffffff; --hLine:#e1e4ea; --bGlow1:rgba(47,127,217,.12); --bGlow2:rgba(47,127,217,.03);
  color-scheme:light;} }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{padding-bottom:84px;min-height:100vh}
body.resting{padding-bottom:160px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--ph)}
.mono{font-family:"JetBrains Mono",monospace}
header{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:blur(10px);padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;letter-spacing:.5px;font-size:18px}
.brand span{color:var(--text)}
.brand{display:flex;align-items:center;gap:7px}
.brand .mark{width:26px;height:26px;flex:none}
.brand .bt{font-weight:800}
.brand .bt i{font-style:normal;color:var(--accent)}
.count{font-size:12px;color:var(--muted);text-align:right;line-height:1.25}
.count.on{cursor:pointer;padding:2px 0 2px 10px}
.count b.add{font-size:13px;color:var(--text)}
.count b{color:var(--text);font-size:15px}
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.banner{background:var(--oBg);border:1px solid var(--oB);color:var(--oT);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.hidden{display:none!important}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:18px 2px 10px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.tplgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;min-height:86px}
.tpl:active{transform:scale(.98)}
.tpl b{display:block;font-size:16px;margin-bottom:4px}
.tpl small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.tpl.hy{border-color:var(--oB);background:linear-gradient(160deg,var(--cBg),var(--panel))}
.tpl.hy b{color:var(--text)}
a.btn{color:var(--text);text-decoration:none}
.dtable td.exn{text-align:left!important;font-family:Inter,sans-serif!important;color:var(--text)!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.sessionhead{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.sessionhead input{font-weight:700;font-size:17px;background:transparent;border-color:transparent;padding:6px 4px}
.snamebox{flex:1;min-width:0;display:flex;align-items:center;gap:4px;border-bottom:1.5px dashed var(--line);cursor:text}
.snamebox input{flex:1;min-width:0;width:100%}
.snamebox span{color:var(--muted);font-size:15px;pointer-events:none}
.snamebox:focus-within{border-bottom-color:var(--accent)}
.sessionhead input:focus{background:var(--panel2)}
.elapsed{color:var(--muted);font-size:13px;white-space:nowrap}
.rqgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rqgrid input{width:100%;min-width:0;box-sizing:border-box}
.rq3{grid-column:span 2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rqopt{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.updcard{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);transform:translateY(20px);opacity:0;transition:transform .25s,opacity .25s}
.updcard.in{transform:none;opacity:1} .updcard.out{transform:translateY(20px);opacity:0}
.updcard .ucx{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer}
.updcard .uct{display:flex;gap:8px;align-items:center;font-size:15px;padding-right:28px} .updcard .uct span{color:var(--accent)}
.updcard .ucl{font-size:13px;line-height:1.55;color:var(--text2);margin:6px 0 10px}
.pn{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)} .pn:last-child{border-bottom:0}
.pni{flex:none;width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:17px}
.pn div>b{display:block;font-size:15px} .pn p b{color:var(--text)} .pn p{margin:3px 0 0;font-size:13px;line-height:1.45;color:var(--text2)}
.unitsw{font:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.sesside{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.savedind{font-size:11px;color:var(--muted);opacity:.55;transition:color .2s,opacity .2s;white-space:nowrap}
.savedind.on{color:var(--good);opacity:1}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.exhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.exname{font-weight:700;font-size:16px;flex:1;line-height:1.25}
.tgt{display:inline-block;font-size:12px;font-weight:600;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;margin:0 0 8px}
.adv{font-size:13px;line-height:1.4;padding:8px 10px;border-radius:10px;margin-bottom:8px;background:var(--panel2);color:var(--text2)}
.adv.up{background:var(--gBg);color:var(--gT)}
.adv.down{background:var(--rBg);color:var(--rT)}
.adv.hold{background:var(--oBg);color:var(--oT)}
.adv.new{background:var(--bBg);color:var(--bT)}
.setrow.top input{border-color:var(--good)}
.setrow.low input{border-color:var(--oB);background:var(--oBg)}
.dl{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:4px;font-family:Inter,sans-serif}
.dl.up{background:var(--gBg);color:var(--good)} .dl.dn{background:var(--rBg);color:var(--bad)} .dl.eq{background:var(--panel2);color:var(--muted)} .dl.new{background:var(--bBg);color:var(--blue)}
.adv.base{background:var(--bBg);color:var(--bT)}
.tgt.sm{display:block;font-size:11px;padding:3px 8px;margin:5px 0 0;color:var(--text2)}
select{appearance:auto}
.energy .stat{grid-template-columns:repeat(3,1fr)}
.step{display:flex;gap:10px;align-items:flex-start}
.step>span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accentInk);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:6px}
details.dd{margin-top:14px}
details.dd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>summary .ddt{flex:1;min-width:0}
details.dd>summary .ddt b{display:block;font-size:15px;font-weight:700}
details.dd>summary small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--oBg);color:var(--accent);border:1px solid var(--oB)}
.ddi svg{width:20px;height:20px}
.ddi.lift{background:var(--bBg);color:var(--blue);border-color:transparent} .ddi.data{background:var(--gBg);color:var(--good);border-color:transparent}
details.dd>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;margin-right:4px;flex:none}
details.dd[open]>summary::after{transform:rotate(45deg) translate(-2px,-2px)}
details.dd[open]>summary{border-color:var(--oB);margin-bottom:10px}
.ddh{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:14px 2px 8px}
.bday{padding:12px}
.bday .bdn{font-weight:700}
.bday .bdd{margin-top:6px;font-size:13px;padding:8px 10px}
.bx{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.bxg{display:grid;grid-template-columns:1.3fr .7fr 1fr 1fr;gap:6px;margin-top:6px}
.bxg label span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.bxg input,.bxg select{padding:8px 6px;font-size:14px}
.chg{font-size:14px;padding:5px 10px;border-radius:8px;background:var(--panel2);margin-bottom:5px}
.chg.add{background:var(--gBg);color:var(--gT)}
.chg.rem{background:var(--rBg);color:var(--rT)}
.libr{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.libr:last-child{border-bottom:0}
.libr small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
body.locked{overflow:hidden}
.modal{overscroll-behavior:contain}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.picker{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.pk{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:640px;height:86vh;height:86dvh;display:flex;flex-direction:column;overflow:hidden}
.pkcats{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;flex:none}
.pkcats::-webkit-scrollbar{display:none}
.pkcats .chip{flex:none}
.plist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 28px;touch-action:pan-y}
.pkh{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:14px 2px 6px}
.pki{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:13px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px;font-size:15px}
.pki small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.pki:active{background:var(--panel2)}
.pknew{background:var(--cBg);border:1px solid var(--cB);border-radius:12px;padding:12px;margin:10px 0}
.bname{flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:600}
.bname span{color:var(--muted);font-size:12px}
.bname.empty{color:var(--muted);font-weight:500}
.bsheet{padding:0;display:flex;flex-direction:column;overflow:hidden;max-height:90vh;max-height:90dvh}
.bscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px 10px}
.bpname{font-size:17px;font-weight:700;margin:10px 0 14px}
.bday2{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-bottom:12px}
.bdh{display:flex;align-items:center;gap:6px}
.bdn2{background:transparent;border:1px solid transparent;padding:5px 4px;font-weight:800;font-size:16px;flex:1;min-width:0}
.bdn2:focus{background:var(--panel2);border-color:var(--accent)}
.bdc{font-size:12px;color:var(--muted);white-space:nowrap}
.bdd2{background:transparent;border:1px solid transparent;padding:2px 4px 8px;font-size:13px;color:var(--muted)}
.bdd2:focus{background:var(--panel2);color:var(--text)}
.bdmenu{display:flex;gap:8px;margin:4px 0 8px}
.bexs{border-top:1px solid var(--line)}
.bxr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.bxe .bxr{border-bottom:0}
.bxn{width:22px;height:22px;border-radius:50%;background:var(--panel2);font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.bxname{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bxsum{font-size:12px;color:var(--muted);font-family:"JetBrains Mono",monospace;white-space:nowrap}
.chev{color:var(--muted);font-size:18px;transition:transform .15s;width:12px;text-align:center}
.bxr.open .chev{transform:rotate(90deg);color:var(--accent)}
.bxr.open .bxn{background:var(--accent);color:var(--accentInk)}
.bxe{background:var(--panel2);border-radius:12px;margin:6px -6px;padding:0 6px}
.bxf{padding:2px 2px 12px;display:grid;gap:12px}
.bxf .l{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.bxf input,.bxf select{background:var(--bg)}
.bname{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600}
.bname span{color:var(--text);font-size:12px;font-weight:600}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accentInk)}
.fl2{display:grid;grid-template-columns:1.1fr 1.2fr 1fr;gap:8px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:10px;height:42px}
.stepper button{width:34px;height:100%;font-size:18px}
.stepper b{font-family:"JetBrains Mono",monospace;font-size:15px}
.rr{display:flex;align-items:center;gap:4px;color:var(--muted)}
.rr input{text-align:center;padding:0 2px;height:42px;font-family:"JetBrains Mono",monospace}
.fl2 select,.fl2>div>input{height:42px;padding:0 8px}
.lnk{font-size:13px;color:var(--muted);padding:4px 2px;font-weight:600}
.lnk.danger{color:var(--bad)}
.badd{width:100%;padding:11px;margin-top:10px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-weight:600;font-size:14px}
.baddday{width:100%;padding:13px;border:1px dashed var(--oB);border-radius:12px;color:var(--text);font-weight:700;margin-top:2px}
.bfoot{flex:none;padding:12px 16px 18px;border-top:1px solid var(--line);background:var(--bg)}
.welcome{background:linear-gradient(160deg,var(--cBg),var(--panel) 60%);border:1px solid var(--line);border-radius:16px;padding:16px;margin:6px 0 4px}
.wh{font-size:21px;font-weight:800;letter-spacing:.2px}
.ws{color:var(--text2);font-size:14px;margin-top:3px;line-height:1.4}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.wstats div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px}
.wstats b{display:block;font-family:"JetBrains Mono",monospace;font-size:21px;color:var(--text);margin-top:2px}
.wstats .wk{font-size:13px;opacity:.9}
.wstats b .u{font-size:13px;font-family:Inter,sans-serif;font-weight:600;color:var(--text2);margin-left:4px}
.wstats em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3}
.wstats div{border-top:3px solid var(--accent)}
.wstats small{display:block;font-size:11px;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.wlast{font-size:13px;color:var(--muted);line-height:1.5}
.wlast b{color:var(--text)} .wlast b.acc{color:var(--text)}
.wbk{display:block;width:100%;text-align:left;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--oBg);border:1px solid var(--oB);color:var(--oT);font-size:13px;font-weight:600}
.schips{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 0 10px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 0}
.sc{min-width:0;padding:2px 4px;border-left:1px solid var(--line);text-align:center}
.sc:first-child{border-left:0}
.sl{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.sv{display:block;font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.sv.na{color:var(--ph);font-weight:400}

</nav>

<div id="modalRoot"></div>

<script>
/* ================== CONFIG ================== */
// Each person's own profile lives on their phone (Profile page), nothing personal is built in.
function getProfile(){ return LS.get("liftlog.profile",{})||{}; }
function raceDate(){ const p=getProfile(); if(!p.raceDate) return null; const d=new Date(p.raceDate+"T09:00:00"); return isNaN(d)?null:d; }
function athleteText(){ const p=getProfile(); const lines=[]; const en=energy();
  const me=[p.name, p.age&&`${p.age} y`, p.sex&&(p.sex==="m"?"male":"female"), p.height&&`${p.height} cm`, bodyKg()&&`${bodyKg()} kg`, p.bf&&`~${p.bf}% body fat${p.bfHow?` (${p.bfHow})`:""}`].filter(Boolean).join(", ");
  if(me) lines.push(`- ${me}.`);
  if(en.tdee) lines.push(`- Estimated maintenance (TDEE): ~${en.tdee} kcal/day (BMR ${en.bmr}, activity "${(ACTIVITY.find(a=>a.v===String(p.activity))||{}).t}").`);
  if(p.race||p.raceDate) lines.push(`- Event/goal: ${p.race||"(unnamed)"}${p.raceDate?` by ${p.raceDate}`:""}.`);
  if(p.goalKg||p.goalBf) lines.push(`- Body goal: ${[p.goalKg&&`about ${p.goalKg} kg`, p.goalBf&&`${p.goalBf}% body fat`].filter(Boolean).join(", ")}.`);
  if(p.about) lines.push(p.about.trim());
  return lines.length ? `Athlete profile (their own words):\n${lines.join("\n")}` : "Athlete profile: not filled in yet.";
}
/* ---------- energy ----------
   BMR: Mifflin-St Jeor. TDEE = BMR × activity factor (the factor already includes your training).
   Workout burn (estimate): runs via ACSM running/walking equations from your distance & time,
   HYROX stations at MET 8 for their logged time, the rest of the session at MET 4 (lifting incl. rests)
   or MET 3 (transitions/walking on run & HYROX days). kcal/min = MET × 3.5 × kg / 200. */
const ACTIVITY=[
  {v:"1.2",  t:"Sedentary",  d:"Desk job, little walking, no training"},
  {v:"1.375",t:"Light",      d:"Mostly sitting, training 1–3×/week"},
  {v:"1.55", t:"Moderate",   d:"On your feet some of the day, or training 3–5×/week"},
  {v:"1.725",t:"Very active",d:"Physical job + training, or hard training 6–7×/week"},
  {v:"1.9",  t:"Extreme",    d:"Heavy manual job + daily hard training"}];
function bodyKg(){ return (weights[0]&&weights[0].kg) || num(getProfile().weight) || null; }
function energy(){ const p=getProfile(), kg=bodyKg(), cm=num(p.height), age=num(p.age), act=num(p.activity);
  const missing=[!p.sex&&"sex",!age&&"age",!cm&&"height",!kg&&"weight",!act&&"activity level"].filter(Boolean);
  if(missing.length) return {missing};
  const mifflin=10*kg+6.25*cm-5*age+(p.sex==="m"?5:-161);
  const bf=num(p.bf), useBf = bf>=3 && bf<=60 && p.bfHow && p.bfHow!=="guess";
  const lbm = bf>=3&&bf<=60 ? kg*(1-bf/100) : null;
  const bmr = useBf ? 370+21.6*lbm : mifflin;
  return {bmr:Math.round(bmr), tdee:Math.round(bmr*act), kg, lbm: lbm&&Math.round(lbm*10)/10, bf, method: useBf?"katch":"mifflin", mifflin:Math.round(mifflin)}; }
// When a session has no usable time (imported, or saved within a few minutes), estimate it from the work done:
// each weight set ≈ 45 s of lifting + that exercise's rest; timed cardio/stations use their own logged time.
function estMinutes(s){
  let sec=0;
  (s.items||[]).forEach(it=>(it.sets||[]).forEach(x=>{ if(x.done===false) return;
    if(it.kind==="w"){ const rest=it.rest ?? getTarget(it.name,it).rest ?? 120; sec+=45+rest; }
    else sec+= x.t || 60; }));
  return sec ? Math.round(sec/60) : 0;
}
function sessionMinutes(s){ // {min, est}: the real time if it's believable, otherwise the estimate
  const est=estMinutes(s), real=s.durationMin||0;
  const done=(s.items||[]).flatMap(it=>(it.sets||[]).filter(x=>x.done!==false).map(x=>({k:it.kind,t:x.t})));
  if(done.length && done.every(x=>x.k!=="w"&&x.t) && real<est) return {min:est, est:false};
  if(real>=5 || (real>0 && real>=est*0.5)) return {min:Math.min(real,1440), est:false};
  return est ? {min:est, est:true} : {min:real, est:false};
}
function sessionKcal(s){
  const kg=bodyKg(); if(!kg){ const w=(s.items||[]).reduce((a,it)=>a+(it.watch?.kcal||0),0); return w||null; }
  const dur=sessionMinutes(s).min;
  const perMin=met=>met*3.5*kg/200; let kcal=0, used=0, hasW=false;
  (s.items||[]).forEach(it=>{ if(it.kind==="w") hasW=true;
    if(it.watch?.kcal){ kcal+=it.watch.kcal; (it.sets||[]).forEach(x=>{ if(x.done!==false&&x.t) used+=x.t; }); return; }
    (it.sets||[]).forEach(x=>{ if(!x.done||!x.t) return; const min=x.t/60;
      if(it.kind==="c" && x.d){ const v=x.d/min; const vo2 = v>134 ? 0.2*v+3.5 : 0.1*v+3.5; kcal+=vo2*kg/1000*5*min; used+=x.t; }
      else if(it.kind==="s"){ kcal+=perMin(8)*min; used+=x.t; } }); });
  if(dur){ const left=Math.min(dur,180)*60-used; if(left>0) kcal+=perMin(hasW?4:3)*left/60; }
  return kcal>0 ? Math.round(kcal) : null;
}
function raceSentence(){ const d=raceDate(); if(!d) return ""; const n=daysTo(d); return n>0?`Their event/goal date is in ${n} days.`:"Their event/goal date has passed."; }

// kinds: w = weight×reps, c = distance(m)+time, s = station: load kg, amount, time
const T = (name, kind, sets, extra={}) => ({name, kind, sets, ...extra});
// lo–hi = rep range, rest = seconds, step = kg jump when progressing
const W = (name, sets, lo, hi, rest, step) => T(name,"w",sets,{lo,hi,rest,...(step?{step}:{})});
// Built-in starter programs. People can also build their own or have Claude make one.
const C1=(name,extra={})=>T(name,"c",1,extra);
const PRESETS={
  ppl:{name:"Push / Pull / Legs", short:"PPL", desc:"3 days, or run it twice a week for 6", days:[
    {name:"Push", desc:"Chest · shoulders · triceps", items:[
      W("Bench Press",3,6,8,180), W("Overhead Press",3,6,8,150), W("Incline DB Press",3,8,10,120,2),
      W("Cable Fly",2,10,15,75), W("DB Lateral Raise",3,12,15,75,2), W("Triceps Pushdown",3,10,15,60)]},
    {name:"Pull", desc:"Back · rear delts · biceps", items:[
      W("Pull-Up",3,6,10,150), W("Barbell Row",3,6,8,150), W("Lat Pulldown",3,8,12,120),
      W("Seated Cable Row",2,10,12,90), W("Face Pull",2,12,15,60), W("DB Curl",3,10,12,60,2)]},
    {name:"Legs", desc:"Quads · hamstrings · calves", items:[
      W("Back Squat",3,6,8,180), W("Romanian Deadlift",3,8,10,150), W("Leg Press",3,10,12,150,5),
      W("Leg Curl",3,10,15,90), W("Leg Extension",2,10,15,90), W("Calf Raise",3,10,15,60)]}]},
  ul:{name:"Upper / Lower", short:"Upper/Lower", desc:"4 days: heavier and lighter version of each", days:[
    {name:"Upper 1", desc:"Strength focus", items:[
      W("Bench Press",3,5,7,180), W("Barbell Row",3,6,8,150), W("Overhead Press",2,6,8,150),
      W("Lat Pulldown",3,8,12,120), W("DB Curl",2,10,12,60,2), W("Triceps Pushdown",2,10,15,60)]},
    {name:"Lower 1", desc:"Strength focus", items:[
      W("Back Squat",3,5,7,180), W("Romanian Deadlift",3,8,10,150), W("Leg Press",2,10,12,150,5),
      W("Leg Curl",2,10,15,90), W("Calf Raise",3,10,15,60), W("Hanging Leg Raise",2,10,15,60)]},
    {name:"Upper 2", desc:"Volume focus", items:[
      W("Incline DB Press",3,8,10,120,2), W("Seated Cable Row",3,10,12,90), W("Seated DB Shoulder Press",3,8,10,120,2),
      W("Pull-Up",3,6,10,150), W("DB Lateral Raise",3,12,15,75,2), W("Hammer Curl",2,10,12,60,2)]},
    {name:"Lower 2", desc:"Volume focus", items:[

function getLib(){ return LS.get("liftlog.programs",[])||[]; }
function saveLib(prog){ if(!prog||!prog.pid||(prog.preset&&!prog.modified)) return; const lib=getLib().filter(x=>x.pid!==prog.pid); lib.unshift({...prog, saved:new Date().toISOString()}); LS.set("liftlog.programs",lib.slice(0,30)); }

function installProgram(prog, opts={}){

  if(cur && cur.pid!==opts.pid) saveLib(cur);            // keep the one you're leaving
  const days=prog.days.map((d,k)=>({id:"d"+k, name:d.name, desc:d.desc||"", items:d.items.map(i=>({...i}))}));
  const next={pid:opts.pid||("p"+Date.now().toString(36)), preset:opts.preset||null, modified:!!opts.modified, name:prog.name, desc:prog.desc||"", installed:new Date().toISOString(), days};
  LS.set("liftlog.program",next);

function getTarget(name, base={}){

           sets: saved.sets ?? base.sets ?? null };

function parseTime(s){ // "m:ss" | "h:mm:ss" | "mm" -> seconds
  s = String(s||"").trim(); if(!s) return null;
  const p = s.split(":").map(Number); if(p.some(isNaN)) return null;
  if(p.length===1) return p[0]*60;
  if(p.length===2) return p[0]*60+p[1];
  return p[0]*3600+p[1]*60+p[2];
}
function fmtTime(sec){ if(sec==null||isNaN(sec)) return "–"; sec=Math.round(sec);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;}
const num = v => { const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; };
const e1rm = (w,r) => (w&&r) ? w*(1+r/30) : 0;
function fmtDate(iso,opts={weekday:"short",day:"numeric",month:"short"}){ return new Date(iso).toLocaleDateString("en-GB",opts); }
function daysTo(d){ return Math.ceil((d - new Date())/86400000); }
function pace(d,t){ if(!d||!t) return null; return t/(d/1000); } // sec per km
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function setSummary(item,set){
  if(item.kind==="w"){ return set.w!=null||set.r!=null ? `${set.w!=null&&isPl(item)?set.w+" pl":set.w??"BW"}×${set.r??"?"}${set.q!=null?` RIR${set.q}`:""}` : null; }
  if(item.kind==="c"){ if(set.d==null&&set.t==null) return null; const p=pace(set.d,set.t); return `${set.d?(set.d>=1000?(set.d/1000)+"km":set.d+"m"):""}${set.t?" "+fmtTime(set.t):""}${p?" ("+fmtTime(p)+"/km)":""}`.trim(); }
  if(item.kind==="s"){ if(set.a==null&&set.t==null&&set.w==null) return null; return `${set.a??""}${item.unit?" "+item.unit:""}${set.w?" @"+set.w+"kg":""}${set.t?" "+fmtTime(set.t):""}`.trim(); }
}
function lastFor(name, excludeId){
  for(const s of sessions){ if(s.id===excludeId) continue;
    const it=(s.items||[]).find(i=>i.name.toLowerCase()===name.toLowerCase());
    if(it && (it.sets||[]).some(x=>x.done)) return {session:s,item:it}; }
  return null;
}
/* ---------- session names: "Empty session" names itself from what's in it ---------- */
const GENERIC_NAME=/^(empty session|session|workout|)$/i;
function autoName(items){
  const its=(items||[]).filter(i=>(i.sets||[]).some(x=>x.done!==false));
  if(!its.length) return "Session";
  const W=its.filter(i=>i.kind==="w"), C=its.filter(i=>i.kind==="c"), S=its.filter(i=>i.kind==="s");
  const dist=i=>(i.sets||[]).reduce((n,x)=>n+(x.done!==false&&x.d?x.d:0),0);
  if(!W.length&&!S.length){ if(C.length===1){ const d=dist(C[0]); return d?`${C[0].name} · ${kmTxt(d)}`:C[0].name; }
    const d=C.reduce((n,i)=>n+dist(i),0); return d?`Cardio · ${kmTxt(d)}`:"Cardio"; }
  if(W.length&&C.length) return `Strength + ${C.length===1?C[0].name:"Cardio"}`;
  const L=W.length?W:S, extra=its.length-1; return `${L[0].name}${extra?` + ${extra} more`:""}`; }
function sName(s){ return GENERIC_NAME.test(String(s&&s.name||"").trim()) ? autoName(s&&s.items) : s.name; }
function sessionVolume(s){ let v=0,sets=0; (s.items||[]).forEach(i=>(i.sets||[]).forEach(x=>{ if(!x.done) return; sets++; if(i.kind==="w"&&i.unit!=="plates"&&x.w&&x.r) v+=x.w*x.r; })); return {v,sets}; } // plate sets have no kg, so they don't count toward tons
/* ---------- kg or plates: cable and machine stacks often have no (or faded) numbers, so these can be logged in plates ---------- */
const STACK_RE=/cable|machine|pulldown|pushdown|pec deck|face pull|leg curl|leg extension|hamstring curl|straight-arm/i;
const isPl=it=>!!it&&it.unit==="plates";
const wU=it=>isPl(it)?"plates":"kg";
function exUnit(name){ // "plates" or "kg" for a lift: your last choice for it, else how you last logged it, else plates for cable/machine
  const U=LS.get("liftlog.units",{})||{}; const k=Object.keys(U).find(n=>n.toLowerCase()===String(name).toLowerCase()); if(k) return U[k];
  const l=lastFor(name); if(l) return l.item.unit==="plates"?"plates":"kg";
  return STACK_RE.test(name)?"plates":"kg"; }
function setExUnit(name,u){ const U=LS.get("liftlog.units",{})||{}; Object.keys(U).forEach(n=>{ if(n.toLowerCase()===name.toLowerCase()) delete U[n]; }); U[name]=u; LS.set("liftlog.units",U); }

/* The live session is written to this phone on every change, straight away (no delay), and again when the page is hidden.
   If UP/LIFT is open twice (home-screen icon + a tab), each copy picks up the newest saved session when it comes back,
   so an older copy can never save over newer sets. */
function saveDraft(){ if(active){ active.savedAt=Date.now(); LS.set("liftlog.draft",active); } else LS.del("liftlog.draft"); markSaved(); }
let savedFlash=null;
function markSaved(){ const e=$("#savedInd"); if(!e) return; e.textContent="Saved ✓"; e.classList.add("on"); clearTimeout(savedFlash); savedFlash=setTimeout(()=>e.classList.remove("on"),1200); }
function adoptNewestDraft(){ // returns true if this copy's live session was replaced by a newer one saved by another copy
  let d; try{ const v=localStorage.getItem("liftlog.draft"); d=v?JSON.parse(v):null; }catch(e){ return false; }
  if(!active && !d) return false;
  if(active && d && d.id===active.id && (d.savedAt||0)<=(active.savedAt||0)) return false;
  if(active && !d){ active=null; stopRest(); toast("That session was saved or discarded in another window"); }
  else { if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); active=d; }
  return true; }
function reloadFromPhone(){ // another copy of the app may have saved sessions or a newer live session meanwhile
  const S=LS.get("liftlog.sessions",null), W=LS.get("liftlog.weights",null); let changed=false;
  if(S && JSON.stringify(S)!==JSON.stringify(sessions)){ sessions=S; changed=true; }
  if(W && JSON.stringify(W)!==JSON.stringify(weights)){ weights=W; changed=true; }
  if(changed) rebuildKnown();
  const took=adoptNewestDraft();
  if(took || (changed && !(active&&view==="log"))){ const y=window.scrollY; show(view); window.scrollTo(0,y); } }

function gcKm(a,b){ const R=6371, r=x=>x*Math.PI/180, dLat=r(b[0]-a[0]), dLon=r(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
const ROUTES=Object.entries(AIRPORTS).map(([c,ll])=>({c, km:gcKm([2.7456,101.7099],ll)})).sort((a,b)=>a.km-b.km);
const kgParts=n=>{ if(n<1000) return [String(Math.round(n)),"kg"]; const v=(n/1000).toFixed(n>=100000?0:1); return [v==="1.0"?"1":v, (v==="1.0"||v==="1")?"ton":"tons"]; };
const kgfmt=n=>kgParts(n).join(" ");

}
function liftedStat(){ // headline = real weight lifted; underneath = the same weight in aircraft
  const total=sessions.reduce((t,s)=>t+sessionVolume(s).v,0);
  if(!total) return {k:"🏋", v:"0", u:"kg", l:"Lifted", s:"First target: a Cessna 172"};
  let i=AIRCRAFT.length-1; while(i>=0 && total<AIRCRAFT[i].kg) i--;
  if(i<0) return {k:"🏋", v:kgParts(total)[0], u:kgParts(total)[1], l:"Lifted", s:`${Math.floor(total/AIRCRAFT[0].kg*100)}% of a Cessna 172`};
  const a=AIRCRAFT[i], x=total/a.kg; let n=x<10?x.toFixed(1):String(Math.round(x)); if(n==="1.0") n="1";

function distanceStat(){

  const km=m/1000;
  if(!km) return {k:"✈", v:"0 km", l:"Distance flown", s:"Log a run to take off"};
  const nx=ROUTES.find(r=>r.km>km);
  if(!nx){ const far=ROUTES[ROUTES.length-1]; return {k:"✈", v:(km/far.km).toFixed(1)+"×", l:`KUL → ${far.c}`, s:`${Math.round(km).toLocaleString()} km covered`}; }

  return {date:d.toISOString(), name:String(s.name||"Session").slice(0,40), notes:String(s.notes||"").slice(0,1000), durationMin: dm&&dm>0&&dm<1000?Math.round(dm):0, items};
}
function sessionSig(s){ return s.date.slice(0,10)+"|"+(s.items||[]).map(i=>i.name+":"+(i.sets||[]).map(x=>[x.w,x.r,x.d,x.t,x.a].join("/")).join(",")).join(";"); }
function readClaudeReply(text){
  const o=extractJson(text), out={};
  const prog = o.program || (o.days?o:null);
  if(prog){ if(!Array.isArray(prog.days)||!prog.days.length) throw new Error("The program has no days.");
    out.program={name:String(prog.name||"My program").slice(0,60), desc:String(prog.desc||prog.note||"").slice(0,120),
      days:prog.days.slice(0,7).map((d,k)=>{ const ex=(d.exercises||d.items||[]).slice(0,12); if(!ex.length) throw new Error(`Day ${k+1} has no exercises.`);
        return {name:String(d.name||`Day ${k+1}`).slice(0,40), desc:String(d.note||d.desc||"").slice(0,80), items:ex.map(fromClaudeEx)}; })}; }
  const wk = o.workout || (o.exercises?o:null);
  if(wk){ const ex=(wk.exercises||[]).slice(0,15); if(!ex.length) throw new Error("The workout has no exercises.");
    out.workout={name:String(wk.name||"Claude's workout").slice(0,40), items:ex.map(fromClaudeEx)}; }
  const ss = Array.isArray(o.sessions)?o.sessions : o.session?[o.session] : null;
  if(ss){ out.sessions=ss.slice(0,20).map(fromClaudeSession).filter(Boolean); if(!out.sessions.length) throw new Error("Couldn't read any sessions in that reply."); }
  if(o.profile&&typeof o.profile==="object") out.profile=o.profile;
  if(Array.isArray(o.baselines)) out.baselines=o.baselines.filter(b=>b&&b.name).slice(0,40);
  if(!out.program&&!out.workout&&!out.profile&&!out.baselines&&!out.sessions) throw new Error("Couldn't find a profile, program, workout or session in that reply.");
  return out;
}
function applyProfile(pf){
  const pr=getProfile(); const actMap={sedentary:"1.2",light:"1.375",moderate:"1.55",very:"1.725","very active":"1.725",extreme:"1.9"};
  if(pf.name) pr.name=String(pf.name).slice(0,40);
  if(num(pf.age)) pr.age=String(num(pf.age));
  if(pf.sex){ const s=String(pf.sex).toLowerCase(); if(s.startsWith("m")) pr.sex="m"; else if(s.startsWith("f")) pr.sex="f"; }
  if(num(pf.height_cm)) pr.height=String(num(pf.height_cm));
  if(pf.activity!=null){ const a=String(pf.activity).toLowerCase(); pr.activity = actMap[a] || (ACTIVITY.find(x=>x.v===String(num(a)))||{}).v || pr.activity; }
  if(num(pf.goal_weight_kg)) pr.goalKg=String(num(pf.goal_weight_kg));
  if(num(pf.body_fat_pct)) pr.bf=String(num(pf.body_fat_pct));
  if(["guess","scale","caliper","dexa"].includes(String(pf.body_fat_method||"").toLowerCase())) pr.bfHow=String(pf.body_fat_method).toLowerCase();
  if(num(pf.goal_body_fat_pct)) pr.goalBf=String(num(pf.goal_body_fat_pct));
  if(pf.event) pr.race=String(pf.event).slice(0,60);
  if(/^\d{4}-\d{2}-\d{2}$/.test(pf.event_date||"")) pr.raceDate=pf.event_date;
  if(pf.about) pr.about=String(pf.about).slice(0,2000);
  if(num(pf.weight_kg)) pr.weight=num(pf.weight_kg);
  LS.set("liftlog.profile",pr);
  return num(pf.weight_kg);
}
async function applyReply(r){
  if(r.profile){ const kg=applyProfile(r.profile); if(kg&&kg>=30&&kg<=250){ try{ await putWeight(kg); }catch(e){} } renderCountdown(); }
  if(r.baselines){ const all=LS.get("liftlog.baseline",{})||{}; r.baselines.forEach(b=>{ const o={date:new Date().toISOString()}; if(num(b.kg)) o.w=num(b.kg); if(num(b.reps)) o.r=Math.round(num(b.reps)); if(o.w!=null||o.r!=null) all[String(b.name).slice(0,60)]=o; }); LS.set("liftlog.baseline",all); }
  if(r.program) installProgram(r.program);
  if(r.sessions){ const have=new Set(sessions.map(sessionSig)); let n=0;
    for(const s of r.sessions){ if(have.has(sessionSig(s))) continue; await putSession("imp"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), s); n++; }
    r._saved=n; r._dupes=r.sessions.length-n; }
}
function replySummary(r){
  const parts=[];
  if(r.profile) parts.push(`<b>Profile:</b> ${esc([r.profile.name,r.profile.age&&r.profile.age+" y",r.profile.height_cm&&r.profile.height_cm+" cm",r.profile.weight_kg&&r.profile.weight_kg+" kg",r.profile.activity].filter(Boolean).join(", ")||"details")}`);
  if(r.baselines) parts.push(`<b>Baselines:</b> ${r.baselines.length} lift${r.baselines.length===1?"":"s"}`);
  const dayList=d=>`<div style="margin:6px 0 0"><b>${esc(d.name)}</b><div class="muted" style="font-size:12px;line-height:1.45">${d.items.map(i=>esc(i.name)+(i.kind==="w"?` ${i.sets}×${i.lo}–${i.hi}${i.sugW?` @${i.sugW}kg`:""}`:` ×${i.sets}`)).join(" · ")}</div></div>`;
  if(r.program) parts.push(`<b>Program:</b> ${esc(r.program.name)} (${r.program.days.length} day${r.program.days.length>1?"s":""})${r.program.days.map(dayList).join("")}`);
  if(r.workout) parts.push(`<b>Workout:</b>${dayList(r.workout)}`);
  if(r.sessions) r.sessions.forEach(s=>{ const dup=sessions.some(o=>sessionSig(o)===sessionSig(s));
    parts.push(`<b>${esc(s.name)}</b> · ${fmtDate(s.date,{weekday:"short",day:"numeric",month:"short",year:"numeric"})}${dup?` <span class="tag">already logged, will skip</span>`:""}
    <div class="muted" style="font-size:12.5px;line-height:1.5;margin-top:3px">${s.items.map(i=>`${esc(i.name)}: ${esc(i.sets.map(x=>setSummary(i,x)).filter(Boolean).join(", "))}${i.watch?` <span style="white-space:nowrap">${[i.watch.kcal&&i.watch.kcal+" kcal",i.watch.hr&&"♥ "+i.watch.hr,i.watch.elev!=null&&"⛰ "+i.watch.elev+" m"].filter(Boolean).join(" · ")}</span>`:""}`).join("<br>")}</div>`); });
  return parts.map(p=>`<div style="margin-bottom:8px;font-size:14px;line-height:1.45">${p}</div>`).join("");
}

function buildLogPrompt(note){

  return `You turn a person's workout notes, photos or screenshots (gym notes, a notebook, a fitness watch or app) into data for their workout-logging app. Read everything they send (text and any attached images) and reply with a 1-3 line summary of what you logged and any assumption you made (e.g. the date), then ONE JSON code block in the format below.

What they sent:
${note.trim()||"(see the attached photo(s) or screenshot(s))"}

Format:

Rules:
- One object per set, in order. If the weight changes partway through, each set gets its own kg.
- Dumbbell kg = per hand. Bodyweight moves: leave kg out. "rir" = reps in reserve (0 = to failure); leave it out if not given.
- "type": "weight" for lifts; "run" for runs, walks, rides, rows and other distance cardio (one set per continuous effort, distance in metres, time as h:mm:ss or m:ss); "station" for timed conditioning stations (unit "m" or "reps").

- duration_min only if known (e.g. a watch's workout time). start_time 24h, only if known.

}

/* ---------- double progression ----------
   Hit the TOP of the rep range on every working set -> add weight next time, reps reset to the bottom.
   Otherwise keep the weight and try to add a rep to each set.
   Below the bottom of the range two sessions running -> suggest a ~10% reset. */
const roundTo=(x,st)=>Math.round(x/st)*st;
function priorSessionsFor(name, excludeId, n=2, pl=null){
  const out=[]; for(const s of sessions){ if(s.id===excludeId) continue;
    const it=(s.items||[]).find(i=>i.name.toLowerCase()===name.toLowerCase() && (pl==null || (i.unit==="plates")===pl));
    if(it && it.sets.some(x=>x.done)) { out.push({session:s,item:it}); if(out.length>=n) break; } }
  return out;
}
function progressionFor(it){
  if(it.kind!=="w") return null;
  const pl=isPl(it), U=pl?"plates":"kg";
  const lo=it.lo??8, hi=it.hi??12, step=pl?1:(it.step??2.5);
  const prev=priorSessionsFor(it.name, active&&active.id, 2, pl);
  if(!prev.length && it.sugW){ const want=Math.max(it.sets.length,1); return {state:"base", msg:`Claude suggests ${it.sugW} ${U} for ${lo}–${hi} reps.`, sug:Array.from({length:want},()=>({w:it.sugW,r:lo}))}; }
  if(!prev.length){
    const b0=getBaseline(it.name), b=b0&&((b0.u==="plates")!==pl)?{...b0,w:null}:b0, want=Math.max(it.sets.length,1);
    if(!b || (b.w==null && b.r==null)) return {state:"new", msg:`No baseline yet — pick a weight you could lift for about 2 more reps than ${hi}, or set it on the Profile page.`, sug:[]};
    const fill=o=>Array.from({length:want},()=>o);
    if(b.w==null) return {state:"base", msg:`From your baseline: ${b.r} reps. Aim for ${Math.min(hi,b.r)}+ each set.`, sug:fill({r:Math.min(hi,b.r)})};
    if(b.r==null) return {state:"base", msg:`From your baseline: start at ${b.w} ${U} and aim for ${lo}–${hi} reps.`, sug:fill({w:b.w,r:lo})};
    if(b.r>=hi){ const nw=+(b.w+step).toFixed(2); return {state:"up", msg:`Baseline ${b.w}×${b.r} already hits the top of ${lo}–${hi} → start at ${nw} ${U} for ${lo}+ reps.`, sug:fill({w:nw,r:lo})}; }
    if(b.r<lo){ const nw=Math.max(step,Math.min(b.w-step,roundTo(b.w*0.9,step))); return {state:"hold", msg:`Baseline ${b.w}×${b.r} is under ${lo} reps → start lighter at ${nw} ${U} and aim for ${lo}+.`, sug:fill({w:nw,r:lo})}; }
    return {state:"base", msg:`From your baseline: ${b.w} ${U} × ${b.r}. Match it on every set, then build to ${hi}.`, sug:fill({w:b.w,r:b.r})};
  }
  const sets=prev[0].item.sets.filter(x=>x.done && x.r!=null);
  if(!sets.length) return null;
  const bw = sets.every(x=>!x.w);
  const topW=Math.max(...sets.map(x=>x.w||0));
  const work=sets.filter(x=>(x.w||0)===topW);
  const want=Math.max(it.sets.length,1);
  const allTop = work.length>=Math.min(want,sets.length) && work.every(x=>x.r>=hi);
  const below = work.some(x=>x.r<lo);
  if(bw){
    if(allTop) return {state:"up", msg:`All sets hit ${hi}. Add load (vest, weight plate, DB) or a harder variation.`, sug:work.map(()=>({r:hi}))};
    return {state:"reps", msg:`Beat last time: +1 rep per set, up to ${hi}.`, sug:work.map(x=>({r:Math.min(hi,x.r+1)}))};
  }
  if(allTop){ const nw=+(topW+step).toFixed(2);
    return {state:"up", msg:`Hit ${hi} on every set last time → go up to ${nw} ${U} and aim for ${lo}+ reps.`, sug:Array.from({length:want},()=>({w:nw,r:lo}))}; }
  if(below){
    const prevBelow = prev[1] && (()=>{ const ps=prev[1].item.sets.filter(x=>x.done&&x.r!=null); const tw=Math.max(...ps.map(x=>x.w||0)); if(tw!==topW) return false;
      const pw=ps.filter(x=>(x.w||0)===tw); const tot=a=>a.reduce((n,x)=>n+x.r,0);
      return pw.some(x=>x.r<lo) && tot(work) <= tot(pw); })();
    if(prevBelow){ const nw=Math.max(step,Math.min(topW-step,roundTo(topW*0.9,step)));
      return {state:"down", msg:`Under ${lo} reps two sessions running at ${topW} ${U} → reset to ${nw} ${U} and build back up.`, sug:Array.from({length:want},()=>({w:nw,r:hi-1}))}; }
    return {state:"hold", msg:`Fell short of ${lo} last time → stay at ${topW} ${U} and aim for ${lo}+ on every set.`, sug:Array.from({length:want},(_,j)=>({w:topW,r:Math.max(lo,(work[j]||work[work.length-1]).r)}))};
  }
  return {state:"reps", msg:`Stay at ${topW} ${U} and add a rep per set (range ${lo}–${hi}).`, sug:Array.from({length:want},(_,j)=>({w:topW,r:Math.min(hi,((work[j]||work[work.length-1]).r)+1)}))};
}

function updateBaselinesFrom(doc){ // after a save, each exercise's starting weight becomes what you just did (if this is your newest log of it)

  (doc.items||[]).forEach(it=>{ const sets=(it.sets||[]).filter(x=>x.done!==false); if(!sets.length) return;
    const nm=it.name.toLowerCase();
    if(sessions.some(s=>s.date>doc.date && (s.items||[]).some(i=>i.name.toLowerCase()===nm && (i.sets||[]).some(x=>x.done!==false)))) return;
    const key=Object.keys(B).find(n=>n.toLowerCase()===nm)||it.name, o={date:new Date().toISOString(), auto:true};
    if(it.kind==="w"){ const ws=sets.filter(x=>x.r!=null); if(!ws.length) return; const tw=Math.max(...ws.map(x=>x.w||0));
      if(tw) o.w=tw; o.r=Math.max(...ws.filter(x=>(x.w||0)===tw).map(x=>x.r)); if(it.unit==="plates") o.u="plates"; }
    else if(it.kind==="c"){ const best=sets.filter(x=>x.d||x.t).sort((a,b)=>(b.d||0)-(a.d||0))[0]; if(!best) return; if(best.d) o.d=best.d; if(best.t) o.t=best.t; }

  const items = active.items.map(it=>({name:it.name,kind:it.kind,...(it.unit?{unit:it.unit}:{}),...(it.kind==="w"&&it.lo!=null?{lo:it.lo,hi:it.hi}:{}),...(watchOf(it)?{watch:watchOf(it)}:{}),sets:it.sets.filter(s=>s.done).map(s=>{const o={done:true};["w","r","d","t","a","q"].forEach(k=>{if(s[k]!=null)o[k]=s[k]});return o;})})).filter(it=>it.sets.length);
  if(!items.length){ confirmDlg("No sets are ticked yet. Tick ✓ on the sets you completed, or discard the session.","OK",()=>{},true); return; }
  const doc={ date:active.date, name:GENERIC_NAME.test((active.name||"").trim())?autoName(items):active.name.trim().slice(0,40), items, notes:active.notes||"", durationMin:active.editing?active.durationMin:Math.round((Date.now()-active.startedAt)/60000), ...(active.oneOff?{oneOff:true}:{}), ...(active.editing&&active.comment?{comment:active.comment}:{}) };
  const id=active.id;
  const btn=$("#finish"); btn.disabled=true; btn.textContent="Saving…";
  try{ await putSession(id,doc); updateBaselinesFrom(doc); }
  catch(e){ btn.disabled=false; btn.textContent="Finish & save"; showBanner(e&&e.code==="quota_exceeded" ? "Storage is full — delete some old sessions and try again." : "Couldn't save just now. Your draft is kept on this phone — try again in a moment."); return; }
  if(active.editing){ active=null; LS.del("liftlog.draft"); stopRest(); toast("Changes saved ✓"); renderLog(); openSession(id); return; }
  const planned=active; const change=dayChanges(planned);
  active=null; LS.del("liftlog.draft"); stopRest(); toast("Session saved 💪");
  renderLog();
  const after=()=>openSession(id, true);
  if(change) askUpdateDay(change, after);
  else if(!planned.dayId && planned.items.some(i=>(i.name||"").trim())) askSaveAsDay(doc.name, planned.items, after);
  else after();
}
/* ---------- keep program days in step with what you actually do ---------- */
function dayChanges(sess){
  if(!sess||!sess.dayId) return null;
  const prog=getProgram(); if(!prog||(sess.pid&&sess.pid!==prog.pid)) return null;
  const day=prog.days.find(d=>d.id===sess.dayId); if(!day) return null;
  const key=n=>String(n||"").trim().toLowerCase();
  const now=sess.items.filter(i=>(i.name||"").trim()), was=day.items;
  const nowK=now.map(i=>key(i.name)), wasK=was.map(i=>key(i.name));
  const added=now.filter(i=>!wasK.includes(key(i.name))).map(i=>i.name);
  const removed=was.filter(i=>!nowK.includes(key(i.name))).map(i=>i.name);
  const common=nowK.filter(k=>wasK.includes(k)), commonWas=wasK.filter(k=>nowK.includes(k));
  const reordered=common.join("|")!==commonWas.join("|");
  if(!added.length&&!removed.length&&!reordered) return null;
  return {day, sess, now, added, removed, reordered};
}
function askUpdateDay(c, after){
  const lines=[...c.added.map(n=>`<div class="chg add">＋ ${esc(n)}</div>`), ...c.removed.map(n=>`<div class="chg rem">－ ${esc(n)}</div>`), ...(c.reordered?[`<div class="chg">⇅ New exercise order</div>`]:[])].join("");
  const r=document.createElement("div"); r.className="modal center"; r.style.alignItems="center";
  r.innerHTML=`<div class="dlg"><p style="margin-bottom:10px"><b>Update ${esc(c.day.name)} in your program?</b><br><span class="muted" style="font-size:13px">You changed the exercises in this session:</span></p>
    <div style="margin-bottom:14px">${lines}</div>
    <div class="muted" style="font-size:12px;margin-bottom:14px;line-height:1.4">Update so the next ${esc(c.day.name)} starts like this, or keep the program as it is.</div>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn small" data-once>Just this once</button><button class="btn small primary" data-upd>Update program</button></div></div>`;
  document.body.appendChild(r);
  const done=()=>{ r.remove(); after&&after(); };
  r.querySelector("[data-once]").onclick=done;
  r.querySelector("[data-upd]").onclick=()=>{ applyDayUpdate(c); toast(`${c.day.name} updated`); done(); };
}
/* ---------- keep a one-off workout as a new program day ---------- */
function sessToDayItems(items){
  return items.filter(i=>(i.name||"").trim()).map(i=>{
    const done=(i.sets||[]).length || 1; // the sets you planned (a saved session keeps the ones you did)
    const o={name:i.name.trim(), kind:i.kind||"w", sets:Math.max(1,Math.min(10,done))};
    if(o.kind==="w"){ const t=getTarget(o.name,i); Object.assign(o,{lo:i.lo??t.lo, hi:i.hi??t.hi, rest:i.rest??t.rest, step:i.step??t.step}); }
    if(i.unit) o.unit=i.unit; if(i.def) o.def={...i.def};
    else if(o.kind==="c"){ const d=(i.sets||[]).find(s=>s.d)?.d; if(d) o.def={d}; }
    else if(o.kind==="s"){ const a=(i.sets||[]).find(s=>s.a)?.a; if(a) o.def={a}; }
    return o; });
}
function addDayToProgram(name, items){
  let prog=getProgram();
  const day={name:(name||"New day").trim().slice(0,40), desc:"", items:sessToDayItems(items)};
  if(!day.items.length) return false;
  if(!prog){ installProgram({name:"My program", days:[day]}); return true; }
  let nm=day.name, n=2; while(prog.days.some(d=>d.name.toLowerCase()===nm.toLowerCase())) nm=`${day.name} ${n++}`; day.name=nm;
  day.id="d"+(Math.max(-1,...prog.days.map(d=>+String(d.id).slice(1)||0))+1);
  prog.days.push(day);
  if(prog.preset&&!prog.modified&&!/\(my version\)$/.test(prog.name)) prog.name+=" (my version)";
  prog.modified=true; LS.set("liftlog.program",prog); saveLib(prog); rebuildKnown(); return true;
}

function applyDayUpdate(c){
  const prog=getProgram(); const day=prog.days.find(d=>d.id===c.day.id); if(!day) return;
  const key=n=>String(n||"").trim().toLowerCase();
  day.items=c.now.map(i=>{ const old=day.items.find(o=>key(o.name)===key(i.name)); if(old) return old;
    const o={name:i.name.trim(), kind:i.kind, sets:Math.max(1,i.sets.length||1)};
    if(i.kind==="w") Object.assign(o,{lo:i.lo??8, hi:i.hi??12, rest:i.rest??120, step:i.step??stepGuess(i.name)});
    if(i.unit) o.unit=i.unit; if(i.def) o.def={...i.def};
    return o; });
  if(prog.preset&&!prog.modified&&!/\(my version\)$/.test(prog.name)) prog.name+=" (my version)";
  prog.modified=true; LS.set("liftlog.program",prog); saveLib(prog); rebuildKnown();
}

/* ================== HISTORY ================== */
/* Every session shows the same four stats in the same order: time · calories · lifted · distance ("–" when it doesn't apply). */
function sessionStats(s){
  const {v,sets}=sessionVolume(s); let m=0, pm=0, pt=0, hasW=false, hasC=false;
  (s.items||[]).forEach(i=>{ if(i.kind==="w" && (i.sets||[]).some(x=>x.done!==false)) hasW=true;
    if(i.kind==="c") (i.sets||[]).forEach(x=>{ if(x.done===false) return; hasC=true; if(x.d) m+=x.d; if(x.d&&x.t){ pm+=x.d; pt+=x.t; } }); });
  const tm=sessionMinutes(s);
  return {min:tm.min, est:tm.est, kcal:sessionKcal(s), kg:v, km:m/1000, sets, hasW, hasC, pace: pm?pt/(pm/1000):null};
}
// Stats depend on the session: cardio → time · calories · avg pace · distance; strength → time · calories · lifted;
// strength with some cardio logged → time · calories · lifted · distance.

function statChips(s){
  const t=sessionStats(s);
  const cell=(label,val,unit)=>`<div class="sc"><span class="sl">${label}</span>${val==null?'<span class="sv na">—</span>':`<span class="sv">${val}${unit?`<span class="su">${unit}</span>`:""}</span>`}</div>`;
  const time = t.min>=100 ? cell("Time",(t.est?"~":"")+Math.floor(t.min/60)+":"+String(t.min%60).padStart(2,"0"),"h") : cell("Time",t.min?(t.est?"~":"")+t.min:null,"min"), kcal=cell("Calories",t.kcal?(t.est?"~":"")+t.kcal:null,"kcal");
  const [lv,lu]=t.kg?kgParts(t.kg):[null,null];
  const lifted=cell("Lifted",lv,lu);
  const dist=cell("Distance",t.km?(t.km<100?t.km.toFixed(1):Math.round(t.km)):null,"km");
  const pace=cell("Avg pace",t.pace?fmtTime(t.pace):null,"/km");
  const cols = (t.hasC && !t.hasW) ? [time,kcal,pace,dist] : t.hasC ? [time,kcal,lifted,dist] : [time,kcal,lifted];
  return `<div class="schips" style="grid-template-columns:repeat(${cols.length},1fr)">${cols.join("")}</div>`;
}
function watchLine(s){ let hr=0,hw=0,el=0,has=false;
  (s.items||[]).forEach(it=>{ const w=it.watch; if(!w) return; has=true; const t=(it.sets||[]).reduce((a,x)=>a+(x.t||0),0)||1;
    if(w.hr){ hr+=w.hr*t; hw+=t; } if(w.elev) el+=w.elev; });
  if(!has) return ""; const bits=[hw?`♥ ${Math.round(hr/hw)} bpm avg`:null, el?`⛰ ${Math.round(el)} m gain`:null, "⌚ watch data"].filter(Boolean);
  return `<div class="wline">${bits.join(" · ")}</div>`; }
function histCard(s){

function makeSampleData(){
  // ~1 month of Push / Pull / Legs + runs, with double progression, a few bad days and a deload-style dip.
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const START={"Bench Press":55,"Overhead Press":35,"Incline DB Press":20,"Cable Fly":12.5,"DB Lateral Raise":8,"Triceps Pushdown":20,
    "Pull-Up":0,"Barbell Row":50,"Lat Pulldown":45,"Seated Cable Row":45,"Face Pull":15,"DB Curl":10,
    "Back Squat":70,"Romanian Deadlift":60,"Leg Press":100,"Leg Curl":35,"Leg Extension":35,"Calf Raise":60};
  const days=PRESETS.ppl.days, st={};
  // plan: day offset from today (positive = days ago) → what was done. Gaps, doubles and a missed stretch built in.
  const plan=[[30,"Push"],[29,"run"],[28,"Pull"],[26,"Legs"],[25,"run"],[23,"Push"],[22,"Pull"],[20,"Legs"],[19,"run"],
    [16,"Push",{bad:1}],[15,"Pull"],[13,"Legs",{bad:1}],[12,"run",{slow:1}],[9,"Push"],[8,"Pull"],[7,"Legs"],[6,"run"],
    [4,"Push",{deload:1}],[3,"Pull"],[2,"run"],[1,"Legs"],[0,"Push"]];
  const out=[], now=new Date();
  plan.forEach(([ago,what,f={}],n)=>{
    const d=new Date(now); d.setDate(d.getDate()-ago); d.setHours(ago%2?7:18, ago%3?15:40,0,0);
    if(what==="run"){
      const km = f.slow?5 : ({1:5,4:6,8:5,16:10,19:6})[n]||5, pace = (f.slow?372:345) - Math.round(n*1.6) + Math.round(rnd()*10-5);
      out.push({id:"demo_"+n,date:d.toISOString(),name:km>=8?"Long run":"Easy run",notes:"",durationMin:Math.round(km*pace/60),
        items:[{name:km>=8?"Long Run":"Easy Run",kind:"c",sets:[{done:true,d:km*1000,t:km*pace}]},
          ...(n===8||n===19||n===4?[{name:"SkiErg",kind:"s",unit:"m",sets:[{done:true,a:1000,t:({4:262,8:251,19:244})[n]}]},
            {name:"Wall Balls",kind:"s",unit:"reps",sets:[{done:true,a:100,w:6,t:({4:398,8:412,19:371})[n]}]}]:[])]});
      return;
    }
    const day=days.find(x=>x.name===what); let mins=0;
    const items=day.items.map(it=>{
      const s=st[it.name] || (st[it.name]={w:START[it.name]??20, r:it.lo});
      const step=it.step || (it.name.match(/Squat|Deadlift|Leg Press/)?5:2.5);
      const w=f.deload? Math.max(0,Math.round(s.w*0.9/step)*step) : s.w;
      const sets=Array.from({length:it.sets},(_,j)=>{
        let r=s.r - (j===it.sets-1&&rnd()<0.5?1:0) - (j>0&&rnd()<0.3?1:0) - (f.bad?1+Math.round(rnd()):0);
        r=Math.max(it.lo-2,Math.min(it.hi,r)); const q=f.deload?3:Math.max(0,Math.min(3,Math.round(2-(j*0.7)-(f.bad?1:0)+rnd()*0.6)));
        mins+=(45+(it.rest||90))/60; return it.name==="Pull-Up"?{done:true,r,q}:{done:true,w,r,q};
      });
      if(!f.deload && !f.bad){ const jump=1+(rnd()<0.4?1:0);
        if(it.name==="Pull-Up") s.r=Math.min(it.hi,s.r+(rnd()<0.6?1:0));
        else if(sets[0].r>=it.hi){ s.w+=step; s.r=it.lo; } else s.r=Math.min(it.hi,s.r+jump); }
      return {name:it.name,kind:"w",lo:it.lo,hi:it.hi,sets};
    });
    out.push({id:"demo_"+n,date:d.toISOString(),name:what,notes:f.bad?"Slept badly, felt flat":f.deload?"Lighter week, legs still sore":"",durationMin:Math.round(mins),items});
  });
  const W=[]; let kg=78.4;
  for(let ago=30;ago>=0;ago-=2+(ago%5===0?1:0)){ kg+= -0.12 + (rnd()-0.5)*0.9 + (ago===14?0.8:0); const d=new Date(now); d.setDate(d.getDate()-ago); d.setHours(7,0,0,0);
    W.push({id:"demo_w"+ago,date:d.toISOString(),kg:Math.round(kg*10)/10}); }
  return {sessions:out, weights:W};
}

      if(!S.length&&!W.length&&!d.baseline&&!d.targets&&!d.profile) throw 0;

      if(d.program&&Array.isArray(d.program.days)&&d.program.days.length){ const cur=getProgram(); if(cur) saveLib(cur); LS.set("liftlog.program",d.program); rebuildKnown(); }
      if(d.baseline&&typeof d.baseline==="object") LS.set("liftlog.baseline",{...LS.get("liftlog.baseline",{}),...d.baseline});
      if(d.targets&&typeof d.targets==="object") LS.set("liftlog.targets",{...LS.get("liftlog.targets",{}),...d.targets});
      const byId=new Map(sessions.map(s=>[s.id,s])); S.forEach(s=>{ if(s&&s.id&&s.date&&Array.isArray(s.items)) byId.set(s.id,s); });

function openSession(id, autoCoach=false){
  const s=sessions.find(x=>x.id===id); if(!s) return;
  let ups=0;
  const delta=it=>{ if(it.kind!=="w") return ""; const best=x=>Math.max(0,...x.filter(y=>y.done).map(y=>e1rm(y.w,y.r)||((y.r||0)))); 
    const prev=sessions.find(o=>o.date<s.date && (o.items||[]).some(j=>j.name.toLowerCase()===it.name.toLowerCase()));
    if(!prev) return `<span class="dl new">new</span>`;
    const pi=prev.items.find(j=>j.name.toLowerCase()===it.name.toLowerCase());
    const top=x=>{ const d=x.filter(y=>y.done&&y.r!=null); const tw=Math.max(0,...d.map(y=>y.w||0)); return {w:tw, reps:d.filter(y=>(y.w||0)===tw).reduce((n,y)=>n+y.r,0)}; };
    const A=top(it.sets), B=top(pi.sets);
    if(A.w>B.w){ ups++; return `<span class="dl up">▲ +${+(A.w-B.w).toFixed(2)} kg</span>`; }
    if(A.w===B.w && A.reps>B.reps){ ups++; return `<span class="dl up">▲ +${A.reps-B.reps} rep${A.reps-B.reps>1?"s":""}</span>`; }
    if(A.w===B.w && A.reps===B.reps) return `<span class="dl eq">=</span>`;
    if(A.w<B.w) return `<span class="dl dn">▼ ${+(A.w-B.w).toFixed(2)} kg</span>`;
    return `<span class="dl dn">▼ ${A.reps-B.reps} rep${B.reps-A.reps>1?"s":""}</span>`; };
  const rows=(s.items||[]).map(it=>`<tr><td colspan="2" class="exn" style="padding-top:12px;font-weight:700;border-bottom:0">${esc(it.name)} ${delta(it)}${it.lo!=null?` <span class="muted" style="font-weight:400;font-size:12px">${it.lo}–${it.hi}</span>`:""}</td></tr>`+
    it.sets.map((x,j)=>`<tr><td class="muted">Set ${j+1}</td><td>${esc(setSummary(it,x)||"–")}</td></tr>`).join("")).join("");
  const {v,sets}=sessionVolume(s);
  modal(`<div class="sheet">
    <div class="row" id="snameRow"><h3 class="sp" id="snameH">${esc(sName(s))}</h3><button class="iconbtn" id="renameBtn" title="Rename">✎</button><button class="iconbtn" data-close>✕</button></div>
    <div class="muted" style="font-size:13px">${fmtDate(s.date,{weekday:"long",day:"numeric",month:"long"})} · ${sets} set${sets===1?"":"s"}</div>
    ${statChips(s)}${watchLine(s)}
    ${ups?`<div class="adv up" style="margin-top:10px">↑ Progressed on ${ups} exercise${ups>1?"s":""} vs last time</div>`:""}
    <table class="dtable">${rows}</table>
    ${s.notes?`<div class="card" style="margin-top:12px"><div class="muted" style="font-size:12px;margin-bottom:4px">NOTES</div>${esc(s.notes)}</div>`:""}
    <div id="coachBox">${coachHtml(s)}</div>
    <div class="row" style="margin-top:16px;gap:10px">
      <button class="btn small" id="editBtn">✎ Edit</button><button class="btn small" id="repeatBtn">Repeat</button><button class="btn small" id="toProgBtn">＋ Add to program</button><span class="sp"></span>
      <button class="btn small danger" id="delBtn">Delete</button>
    </div></div>`);
  bindCoach(s);
  $("#renameBtn").onclick=()=>{ const row=$("#snameRow"); row.innerHTML=`<input id="renameIn" class="sp" value="${esc(sName(s))}" maxlength="40" style="font-weight:700;font-size:17px"><button class="btn small primary" id="renameOk">Save</button>`;
    const inp=$("#renameIn"); inp.focus(); inp.select();
    const done=async()=>{ const nm=inp.value.trim().slice(0,40)||autoName(s.items); const doc={...s,name:nm}; delete doc.id;
      try{ await putSession(s.id,doc); }catch(e){ showBanner("Couldn't rename right now."); return; }
      const y=window.scrollY; show(view); window.scrollTo(0,y); openSession(s.id); toast("Renamed ✓"); };
    $("#renameOk").onclick=done; inp.onkeydown=e=>{ if(e.key==="Enter") done(); }; };
  $("#toProgBtn").onclick=()=>askSaveAsDay(sName(s), s.items, null, true);
  $("#editBtn").onclick=()=>{ closeModal(); if(active&&!active.editing){ confirmDlg("You have a session in progress. Finish or discard it before editing an old one.","OK",()=>show("log"),true); return; } editSession(s); };
  $("#repeatBtn").onclick=()=>{ closeModal(); if(active){ confirmDlg("You already have a session in progress. Replace it?","Replace",()=>repeat(s)); } else repeat(s); };
  $("#delBtn").onclick=()=>confirmDlg("Delete this session for good?","Delete",async()=>{ try{ await delSession(s.id); closeModal(); toast("Deleted"); show(view);}catch(e){ showBanner("Couldn't delete right now."); } });
  if(autoCoach && sampleFn && !s.comment) runCoach(s);
}
function repeat(s){ const d=programDays().find(x=>x.name===s.name); // repeating a program day still counts as that day
  startSession({...(d?{id:d.id}:{}), name:s.name, items:s.items.map(i=>({name:i.name,kind:i.kind,unit:i.unit,sets:i.sets.length,...(i.lo!=null?{lo:i.lo,hi:i.hi}:{})}))}); show("log"); }

/* ================== CLAUDE COACH ================== */
function coachHtml(s){
  if(s.comment) return `<div class="coach"><div class="h">✦ Coach notes</div><div class="body">${esc(s.comment)}</div><div style="margin-top:10px"><button class="btn small" data-${sampleFn?"coach":"recoach"}>${sampleFn?"Ask again":"Replace feedback"}</button></div></div>`;
  if(!sampleFn) return `<div class="coach"><div class="h">✦ Coach</div><div class="body muted">Copy this session (with your recent history and goals) and paste it into a chat with Claude. Paste the reply back here to keep it with the session.</div>
    <div class="row" style="margin-top:10px;gap:8px"><button class="btn small primary" data-copycoach>Copy for Claude</button><a class="btn small" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a></div>
    <textarea id="pasteReply" style="margin-top:10px" placeholder="Paste Claude's feedback here…"></textarea>
    <button class="btn small block" style="margin-top:8px" data-savereply>Save feedback</button></div>`;
  return `<div class="coach"><div class="h">✦ Coach</div><div class="body muted">Get Claude's take on this session and targets for next time.</div><div style="margin-top:10px"><button class="btn small primary" data-coach>Get feedback</button></div></div>`;
}
function bindCoach(s){
  const b=document.querySelector("[data-coach]"); if(b) b.onclick=()=>runCoach(s);
  const c=document.querySelector("[data-copycoach]"); if(c) c.onclick=()=>copyText(buildCoachPrompt(s),"Copied — paste it into Claude");
  const r=document.querySelector("[data-recoach]"); if(r) r.onclick=()=>{ $("#coachBox").innerHTML=coachHtml({...s,comment:""}); bindCoach(s); };
  const sv=document.querySelector("[data-savereply]"); if(sv) sv.onclick=async()=>{ const t=$("#pasteReply").value.trim(); if(!t) return;
    const i=sessions.findIndex(x=>x.id===s.id); if(i<0) return; sessions[i]={...sessions[i],comment:t}; LS.set("liftlog.sessions",sessions);
    $("#coachBox").innerHTML=coachHtml(sessions[i]); bindCoach(sessions[i]); toast("Feedback saved"); };
}
async function copyText(t,msg){
  try{ await navigator.clipboard.writeText(t); toast(msg||"Copied"); }
  catch(e){ modal(`<div class="sheet"><div class="row"><h3 class="sp">Copy this</h3><button class="iconbtn" data-close>✕</button></div><textarea style="min-height:50vh;font-size:12px" readonly>${esc(t)}</textarea></div>`); }
}
function compactSession(s){
  return `${fmtDate(s.date,{weekday:"short",day:"numeric",month:"short",year:"numeric"})} — ${sName(s)}${s.durationMin?` (${s.durationMin} min)`:""}${sessionKcal(s)?`, ~${sessionKcal(s)} kcal est.`:""}\n`+
    (s.items||[]).map(it=>`  ${it.name}${it.lo!=null?` [target ${it.lo}-${it.hi} reps]`:""}: ${it.sets.map(x=>setSummary(it,x)).filter(Boolean).join(", ")}${it.watch?` [watch: ${[it.watch.kcal&&it.watch.kcal+" active kcal",it.watch.hr&&"avg HR "+it.watch.hr+" bpm",it.watch.elev&&it.watch.elev+" m elevation gain"].filter(Boolean).join(", ")}]`:""}`).join("\n")+
    (s.notes?`\n  Notes: ${s.notes}`:"");
}
let coachAbort=null;
function buildCoachPrompt(s){
  const history=sessions.filter(x=>x.id!==s.id && x.date<s.date).slice(0,10).map(compactSession).join("\n\n")||"(no earlier sessions logged)";
  const wt=weights.slice(0,6).map(w=>`${fmtDate(w.date,{day:"numeric",month:"short"})}: ${w.kg} kg`).join("; ")||"none logged";
  const prompt=`You are a concise, evidence-based strength & conditioning coach (progressive overload, sensible volume, effort near failure, no fluff).

${athleteText()}
${baselineText()}
${raceSentence()?raceSentence()+" ":""}Recent bodyweight: ${wt}.

SESSION TO REVIEW:
${compactSession(s)}

EARLIER SESSIONS (newest first):
${history}

Weights are kg (for DB lifts, per hand). "RIR2" = 2 reps in reserve (0 = to failure); use it to judge effort. Run times are m:ss; pace shown per km.

Write feedback for the athlete to read on their phone right after training. Plain text only, no markdown symbols like ** or #. Use short lines starting with "• ". Max about 120 words. Cover:
• What went well / progress vs earlier sessions (be specific with numbers if there's history).
• Anything to watch (form-agnostic: volume, fatigue, stalled lifts, running pace).
• Concrete targets for next time on 2-4 key exercises (exact kg × reps or run pace).
Don't invent data that isn't shown. If there's little history, say what to track.`;
  return prompt;
}
async function runCoach(s){
  if(!sampleFn) return;
  const box=$("#coachBox"); if(!box) return;
  box.innerHTML=`<div class="coach"><div class="h">✦ Coach</div><div class="body" id="coachText">Thinking…</div></div>`;
  const prompt=buildCoachPrompt(s);
  try{ coachAbort?.abort(); }catch(e){}
  coachAbort=new AbortController();
  let text="";
  try{
    const res=await sampleFn(prompt,{signal:coachAbort.signal, cache:false, onText:({text:t})=>{ text=t; const el=$("#coachText"); if(el) el.textContent=t||"Thinking…"; }});
    text=(res&&res.text)||text;
    const clean=text.trim();
    if(!clean) throw {code:"empty"};
    const upd={...s, comment:clean}; delete upd.id;
    try{ if(mode==="db") await db.collection("sessions").doc(s.id).update({comment:clean}); }catch(e){}
    const i=sessions.findIndex(x=>x.id===s.id); if(i>=0) sessions[i]={...sessions[i],comment:clean};
    if(mode!=="db") LS.set("liftlog.sessions",sessions);
    const b=$("#coachBox"); if(b){ b.innerHTML=coachHtml(sessions[i]||{...s,comment:clean}); bindCoach(sessions[i]); }
  }catch(e){
    const el=$("#coachBox"); if(!el) return;
    if(e&&e.code==="not_granted"){ sampleFn=null; el.innerHTML=""; return; }
    el.innerHTML=`<div class="coach"><div class="h">✦ Coach</div><div class="body muted">${e&&e.code==="rate_limited"?"Coach is busy — try again in a minute.":"Couldn't get feedback right now."}</div><div style="margin-top:10px"><button class="btn small" data-coach>Try again</button></div></div>`;
    bindCoach(s);
  }
}
function buildWeeklyPrompt(){

${athleteText()}
${baselineText()}
${raceSentence()?raceSentence()+" ":""}Bodyweight log: ${wt}.

LAST 14 DAYS OF TRAINING:
${recent}

Give a short two-week check-in, plain text only (no markdown symbols), lines starting with "• ", max about 150 words: training frequency vs their program and profile, strength trend, running/conditioning trend (if they do any), bodyweight or body fat trend vs their goal (if given), and the 2-3 most important priorities for the next two weeks. Don't invent data.`;

async function runWeekly(){

  }catch(e){ box.innerHTML=`<div class="muted" style="font-size:13px">${e&&e.code==="rate_limited"?"Coach is busy — try again shortly.":"Couldn't get a check-in right now."}</div>`; }
}

/* ================== PROGRESS ================== */
function spark(vals,w=84,h=26,color="var(--accent)"){
  if(vals.length<2) return `<svg width="${w}" height="${h}"></svg>`;
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*(w-4)+2).toFixed(1)},${(h-2-(v-mn)/rg*(h-4)).toFixed(1)}`).join(" ");
  const last=pts.split(" ").pop().split(",");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" style="fill:${color}"/></svg>`;
}
/* ---------- activity calendar ---------- */
let calMonth=null; // first day of the month being shown
function dayKey(d){ const x=new Date(d); return `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`; }
function activityHtml(){
  const now=new Date(); if(!calMonth) calMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const y=calMonth.getFullYear(), m=calMonth.getMonth(), days=new Date(y,m+1,0).getDate();
  const byDay={};
  sessions.forEach(s=>{ const d=new Date(s.date); if(d.getFullYear()!==y||d.getMonth()!==m) return;
    const st=sessionStats(s), k=d.getDate(); byDay[k]=byDay[k]||{w:false,c:false,ids:[]};
    if(st.hasW) byDay[k].w=true; if(st.hasC) byDay[k].c=true; if(!st.hasW&&!st.hasC) byDay[k].w=true; byDay[k].ids.push(s.id); });
  const vals=Object.values(byDay), nSess=vals.reduce((t,v)=>t+v.ids.length,0), nDays=vals.length;
  const nStr=vals.filter(v=>v.w).length, nCar=vals.filter(v=>v.c).length;
  const lead=(new Date(y,m,1).getDay()+6)%7; // Monday first
  const isThisMonth = y===now.getFullYear() && m===now.getMonth();
  let cells=""; for(let i=0;i<lead;i++) cells+=`<button class="cd cpad" disabled tabindex="-1" aria-hidden="true"></button>`;
  for(let d=1; d<=days; d++){
    const v=byDay[d], future = isThisMonth ? d>now.getDate() : new Date(y,m,d)>now;
    const cls=v?(v.w&&v.c?"mix":v.c?"cardio":"strength"):"";
    cells+=`<button class="cd ${cls} ${isThisMonth&&d===now.getDate()?"today":""} ${future?"future":""}" ${v?`data-cday="${v.ids[0]}"`:"disabled"}>${d}</button>`;
  }
  const label=calMonth.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  return `<h2>Activity</h2><div class="card cal">
    <div class="row calh"><button class="iconbtn" data-cal="-1">‹</button><b class="sp" style="text-align:center">${label}</b><button class="iconbtn" data-cal="1" ${isThisMonth?"disabled style='opacity:.3'":""}>›</button></div>
    <div class="calsum"><div><b>${nSess}</b><small>session${nSess===1?"":"s"}</small></div><div><b>${nDays}</b><small>active day${nDays===1?"":"s"}</small></div><div><b>${nStr}</b><small><i class="dotk s"></i>strength</small></div><div><b>${nCar}</b><small><i class="dotk c"></i>cardio</small></div></div>
    <div class="calw">${["M","T","W","T","F","S","S"].map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="calg">${cells}</div>
  </div>`;
}
function calGo(n){ // n = +1 next month, -1 previous; returns false if it would go into the future
  const now=new Date(), next=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);
  if(next>now){ const c=document.querySelector(".card.cal"); if(c){ c.classList.remove("calbump"); void c.offsetWidth; c.classList.add("calbump"); } return false; }
  calMonth=next; const y=window.scrollY; renderProgress(); window.scrollTo(0,y);
  const g=document.querySelector(".card.cal .calg"); if(g) g.classList.add(n>0?"slide-l":"slide-r"); return true;
}
function bindActivity(){
  document.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>calGo(+b.dataset.cal));
  const card=document.querySelector(".card.cal");
  if(card){ let sx=null, sy=0, st=0;
    card.addEventListener("touchstart",e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); },{passive:true});
    card.addEventListener("touchend",e=>{ if(sx==null) return; const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; sx=null;
      if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.5 && Date.now()-st<800){ e.preventDefault(); calGo(dx<0?1:-1); } });
  }
  document.querySelectorAll("[data-cday]").forEach(b=>b.onclick=()=>openSession(b.dataset.cday));
}

async function pull(meta,first){
  let off=0, changed=false; const cur=localItems();
  for(;;){
    const q=`/rest/v1/user_items?select=kind,id,data,deleted,updated_at&order=updated_at.asc,kind.asc,id.asc&limit=500&offset=${off}`+(meta.lastPull?`&updated_at=gte.${encodeURIComponent(meta.lastPull)}`:"");
    const rows=await (await api(q)).json();
    for(const row of rows){
      const k=row.kind+":"+row.id;
      if(!meta.lastPull||row.updated_at>meta.lastPull) meta.lastPull=row.updated_at;
      if(row.deleted){ if(cur[k]!==undefined||meta.hash[k]){ removeLocal(row.kind,row.id); delete cur[k]; changed=true; } delete meta.hash[k]; continue; }
      const h=hashStr(JSON.stringify(row.data));
      if(meta.hash[k]===h && cur[k]!==undefined) continue;
      if(first && row.kind==="setting" && cur[k]!==undefined && !isEmptyVal(cur[k]) && isEmptyVal(row.data)) continue;
      applyLocal(row.kind,row.id,row.data); cur[k]=row.data; meta.hash[k]=h; changed=true;

function applyLocal(kind,id,data){

        if(r.status===429) throw new Error("Too many attempts. Wait a few minutes and try again.");

        if(signup&&(m.includes("database error")||m.includes("invalid_invite")||r.status>=500)) throw new Error("That invite code isn't valid or has been used up. Check it with whoever shared the app.");
        if(m.includes("password")&&signup) throw new Error("That password isn't accepted. Use at least 8 characters.");
        if(!signup&&(r.status===400||m.includes("invalid"))) throw new Error("Wrong username or password.");
        throw new Error(r.j.msg||r.j.message||("Something went wrong ("+r.status+")."));
      }

  let best=null;
  (s.items||[]).forEach(it=>{ if(it.kind!=="w") return; (it.sets||[]).forEach(x=>{ if(x.done===false) return; const v=x.w?e1rm(x.w,x.r||1):(x.r||0)/100;

  if(best) return best.t;

async function publishFeed(meta,changedIds,deletedIds){ // called from push(); never breaks sync if it fails
  try{
    const uid=getAuth().user.id;
    if(!shareOn()){ if(meta.feedShared){ await api(`/rest/v1/feed?user_id=eq.${uid}`,{method:"DELETE"}); meta.feedShared=false; } return; }
    let ids=changedIds;
    if(!meta.feedShared||meta.feedVer!==1){ ids=sessions.map(s=>s.id); }
    const rows=sessions.filter(s=>ids.includes(s.id)&&!String(s.id).startsWith("demo_")).map(s=>feedRow(s,uid));
    const post=rs=>api("/rest/v1/feed?on_conflict=user_id,session_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rs)});
    for(let i=0;i<rows.length;i+=200){ const chunk=rows.slice(i,i+200);
      try{ await post(chunk); }catch(e){ if(AVCOL&&noAvCols(e)){ AVCOL=false; LS.set("liftlog.avcol",false); await post(chunk.map(({avatar_e,avatar_c,...r})=>r)); } else throw e; } }
    const gone=deletedIds.concat(sessions.filter(s=>String(s.id).startsWith("demo_")&&ids.includes(s.id)).map(s=>s.id));
    if(gone.length) await api(`/rest/v1/feed?user_id=eq.${uid}&session_id=in.(${gone.map(x=>`"${x}"`).join(",")})`,{method:"DELETE"});
    meta.feedShared=true; meta.feedVer=1;
  }catch(e){ console.warn("feed",e); }
}
